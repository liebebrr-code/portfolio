<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Perfil</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #8b5cf6;
    --secondary: #06b6d4;
    --bg: #050507;
    --card: rgba(10,10,15,.78);
    --text: #ffffff;
    --muted: #a1a1aa;
    --border: rgba(255,255,255,.1);
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
}

/* =====================================================
   FUNDO
===================================================== */

#background {
    position: fixed;
    inset: 0;
    z-index: -5;

    background:
        radial-gradient(
            circle at top,
            rgba(139,92,246,.25),
            transparent 45%
        ),
        #050507;

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    transition: .4s ease;
}

#backgroundOverlay {
    position: fixed;
    inset: 0;
    z-index: -4;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.2),
            rgba(0,0,0,.7)
        );

    pointer-events: none;
}

/* =====================================================
   PERFIL
===================================================== */

.page {
    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 40px 15px;
}

.profile {
    width: min(760px, 100%);

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 28px;

    padding: 35px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.45);

    animation: profileIn .7s ease;
}

@keyframes profileIn {

    from {
        opacity: 0;
        transform: translateY(25px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}

/* =====================================================
   AVATAR
===================================================== */

.avatar-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

.avatar {
    width: 125px;
    height: 125px;

    border-radius: 50%;

    object-fit: cover;

    border: 4px solid var(--primary);

    box-shadow:
        0 0 35px rgba(139,92,246,.5);
}

/* =====================================================
   INFORMAÇÕES
===================================================== */

.username {
    text-align: center;

    font-size: 32px;
    font-weight: 900;

    letter-spacing: -.8px;
}

.username::after {
    content: "✓";

    display: inline-flex;

    align-items: center;
    justify-content: center;

    margin-left: 9px;

    width: 21px;
    height: 21px;

    border-radius: 50%;

    font-size: 12px;

    background: var(--primary);
    color: white;

    vertical-align: middle;
}

.description {
    text-align: center;

    max-width: 600px;

    margin: 12px auto 25px;

    color: var(--muted);

    line-height: 1.6;

    white-space: pre-wrap;
}

/* =====================================================
   LINKS
===================================================== */

.links {
    display: flex;
    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    margin-bottom: 25px;
}

.link {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 100px;

    padding: 11px 17px;

    border-radius: 13px;

    text-decoration: none;

    color: white;

    background: rgba(255,255,255,.07);

    border: 1px solid rgba(255,255,255,.1);

    transition: .2s;
}

.link:hover {
    transform: translateY(-3px);

    background: var(--primary);

    border-color: transparent;

    box-shadow:
        0 10px 25px rgba(139,92,246,.25);
}

/* =====================================================
   STATS
===================================================== */

.stats {
    display: flex;

    justify-content: center;

    gap: 35px;

    margin-bottom: 25px;
}

.stat {
    text-align: center;
}

.stat strong {
    display: block;

    font-size: 20px;
}

.stat span {
    color: var(--muted);

    font-size: 12px;
}

/* =====================================================
   PLAYER
===================================================== */

.player {
    background: rgba(0,0,0,.35);

    border: 1px solid var(--border);

    border-radius: 20px;

    padding: 18px;

    margin-top: 10px;
}

.player-top {
    display: flex;

    align-items: center;

    gap: 13px;

    margin-bottom: 15px;
}

.music-cover {
    width: 52px;
    height: 52px;

    border-radius: 12px;

    object-fit: cover;

    background: rgba(255,255,255,.08);
}

.music-info {
    flex: 1;

    min-width: 0;
}

.music-title {
    font-weight: bold;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.music-artist {
    font-size: 12px;

    color: var(--muted);

    margin-top: 4px;
}

.progress-container {
    width: 100%;

    height: 5px;

    background: rgba(255,255,255,.12);

    border-radius: 10px;

    cursor: pointer;

    margin-bottom: 15px;
}

.progress {
    width: 0%;

    height: 100%;

    border-radius: inherit;

    background: linear-gradient(
        90deg,
        var(--primary),
        var(--secondary)
    );
}

.player-controls {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;
}

.player-btn {
    width: 40px;
    height: 40px;

    border: none;

    border-radius: 50%;

    cursor: pointer;

    color: white;

    background: rgba(255,255,255,.08);

    transition: .2s;
}

.player-btn:hover {
    background: var(--primary);

    transform: scale(1.08);
}

.play-btn {
    width: 48px;
    height: 48px;

    background: var(--primary);

    font-size: 18px;
}

.player-bottom {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 13px;

    color: var(--muted);

    font-size: 11px;
}

.player-options {
    display: flex;

    gap: 7px;
}

.option-btn {
    border: none;

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    font-size: 16px;
}

.option-btn.active {
    color: var(--primary);
}

/* =====================================================
   ADMIN
===================================================== */

.admin-button {
    position: fixed;

    right: 20px;
    bottom: 20px;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border: 1px solid var(--border);

    background: rgba(10,10,15,.8);

    color: white;

    cursor: pointer;

    z-index: 50;

    backdrop-filter: blur(10px);

    transition: .2s;
}

.admin-button:hover {
    background: var(--primary);

    transform: scale(1.08);
}

/* =====================================================
   MODAL
===================================================== */

.modal {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.75);

    backdrop-filter: blur(10px);

    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(700px, 100%);

    max-height: 90vh;

    overflow-y: auto;

    padding: 25px;

    border-radius: 22px;

    background: #0c0c11;

    border: 1px solid var(--border);

    box-shadow: 0 30px 100px rgba(0,0,0,.6);
}

.modal-title {
    font-size: 24px;

    font-weight: 900;

    margin-bottom: 20px;
}

.input-group {
    margin-bottom: 15px;
}

.input-group label {
    display: block;

    font-size: 12px;

    color: var(--muted);

    margin-bottom: 7px;
}

.input,
.textarea {
    width: 100%;

    border: 1px solid var(--border);

    border-radius: 11px;

    outline: none;

    background: rgba(255,255,255,.05);

    color: white;

    padding: 12px;

    font-size: 14px;
}

.textarea {
    min-height: 100px;

    resize: vertical;
}

.input:focus,
.textarea:focus {
    border-color: var(--primary);
}

.admin-actions {
    display: flex;

    gap: 10px;

    margin-top: 20px;
}

.button {
    border: none;

    border-radius: 11px;

    padding: 12px 18px;

    cursor: pointer;

    color: white;

    background: var(--primary);

    font-weight: bold;

    transition: .2s;
}

.button:hover {
    transform: translateY(-2px);
}

.button.secondary {
    background: rgba(255,255,255,.08);
}

.button.danger {
    background: #dc2626;
}

/* =====================================================
   MÚSICAS ADMIN
===================================================== */

.song-editor {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    padding: 15px;

    margin-bottom: 10px;

    border-radius: 14px;

    background: rgba(255,255,255,.04);

    border: 1px solid var(--border);
}

.song-editor .full {
    grid-column: 1 / -1;
}

.remove-song {
    background: #dc2626;
}

@media(max-width:600px) {

    .profile {
        padding: 24px 18px;

        border-radius: 20px;
    }

    .username {
        font-size: 27px;
    }

    .avatar {
        width: 105px;
        height: 105px;
    }

    .stats {
        gap: 22px;
    }

    .song-editor {
        grid-template-columns: 1fr;
    }

    .song-editor .full {
        grid-column: auto;
    }

}

/* =====================================================
   LOADING
===================================================== */

#loading {
    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #050507;

    z-index: 999;

    font-weight: bold;
}

#loading.hidden {
    display: none;
}

</style>
</head>

<body>

<div id="loading">
    Carregando perfil...
</div>

<div id="background"></div>
<div id="backgroundOverlay"></div>

<main class="page">

    <section class="profile">

        <div class="avatar-wrapper">

</main>

<button
    id="adminButton"
    class="admin-button"
    title="Administrador"
>
    ⚙
</button>

<!-- =====================================================
     LOGIN
===================================================== -->

<!-- =====================================================

===================================================== -->

<div

>

    <div class="modal-box">

<audio id="audio"></audio>

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    set
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyB35ktkxiS_MPTrSflfHhBe5snYAV0iV6Q",

    authDomain: "myprofile-7db79.firebaseapp.com",

    databaseURL:
        "https://myprofile-7db79-default-rtdb.firebaseio.com",

    projectId:
        "myprofile-7db79",

    storageBucket:
        "myprofile-7db79.firebasestorage.app",

    messagingSenderId:
        "947862565874",

    appId:
        "1:947862565874:web:3116335ff6f1822f0df16b",

    measurementId:
        "G-KC2ZXS400D"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


/* =====================================================
   REFERÊNCIAS
===================================================== */

const profileRef = ref(
    db,
    "profile"
);


/* =====================================================
   ELEMENTOS
===================================================== */

const loading =
    document.getElementById("loading");

const background =
    document.getElementById("background");

const avatar =
    document.getElementById("avatar");

const username =
    document.getElementById("username");

const description =
    document.getElementById("description");

const links =
    document.getElementById("links");

const views =
    document.getElementById("views");

const likes =
    document.getElementById("likes");

const followers =
    document.getElementById("followers");

const musicCover =
    document.getElementById("musicCover");

const musicTitle =
    document.getElementById("musicTitle");

const musicArtist =
    document.getElementById("musicArtist");

const audio =
    document.getElementById("audio");

const progress =
    document.getElementById("progress");

const progressContainer =
    document.getElementById("progressContainer");

const playBtn =
    document.getElementById("playBtn");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const loopBtn =
    document.getElementById("loopBtn");

const playlistLoopBtn =
    document.getElementById("playlistLoopBtn");

const muteBtn =
    document.getElementById("muteBtn");

const time =
    document.getElementById("time");


/* =====================================================
   ESTADO
===================================================== */

let profileData = {};

let playlist = [];

let currentSong = 0;

let playlistLoop = false;


/* =====================================================
   CARREGAR PERFIL
===================================================== */

onValue(
    profileRef,
    snapshot => {

        const data = snapshot.val();

        if (!data) {

            profileData = {

                username: "Liebebrr",

                avatar: "",

                background: "",

                description:
                    "Meu perfil.",

                primary:
                    "#8b5cf6",

                links: [],

                songs: [],

                stats: {

                    views: 0,

                    likes: 0,

                    followers: 0

                }

            };

        } else {

            profileData = data;

        }

        renderProfile();

        loading.classList.add("hidden");

    },
    error => {

        console.error(error);

        loading.textContent =
            "Erro ao carregar o perfil.";

    }
);


/* =====================================================
   RENDERIZAR PERFIL
===================================================== */

function renderProfile() {

    document.title =
        profileData.username ||
        "Meu Perfil";


    username.textContent =
        profileData.username ||
        "Sem nome";


    description.textContent =
        profileData.description ||
        "";


    avatar.src =
        profileData.avatar ||
        "https://placehold.co/300x300/111/fff?text=Perfil";


    if (profileData.background) {

        background.style.backgroundImage =
            `url("${profileData.background}")`;

    } else {

        background.style.backgroundImage =
            "";

    }


    const primary =
        profileData.primary ||
        "#8b5cf6";


    document.documentElement
        .style
        .setProperty(
            "--primary",
            primary
        );


    views.textContent =
        Number(
            profileData.stats?.views || 0
        ).toLocaleString("pt-BR");


    likes.textContent =
        Number(
            profileData.stats?.likes || 0
        ).toLocaleString("pt-BR");


    followers.textContent =
        Number(
            profileData.stats?.followers || 0
        ).toLocaleString("pt-BR");


    renderLinks();


    playlist =
        Array.isArray(profileData.songs)
            ? profileData.songs
            : [];


    if (
        playlist.length > 0 &&
        currentSong >= playlist.length
    ) {

        currentSong = 0;

    }


    if (playlist.length > 0) {

        loadSong(
            currentSong,
            false
        );

    } else {

        musicTitle.textContent =
            "Nenhuma música";

        musicArtist.textContent =
            "—";

    }

}


/* =====================================================
   LINKS
===================================================== */

function renderLinks() {

    links.innerHTML = "";

    const list =
        Array.isArray(profileData.links)
            ? profileData.links
            : [];


    list.forEach(link => {

        if (!link || !link.url) {
            return;
        }

        const a =
            document.createElement("a");

        a.className =
            "link";

        a.href =
            link.url;

        a.target =
            "_blank";

        a.rel =
            "noopener noreferrer";

        a.textContent =
            link.name ||
            "Link";

        links.appendChild(a);

    });

}


/* =====================================================
   PLAYER
===================================================== */

function loadSong(
    index,
    autoPlay = false
) {

    if (
        !playlist.length ||
        !playlist[index]
    ) {
        return;
    }


    currentSong = index;


    const song =
        playlist[index];


    audio.src =
        song.url || "";


    audio.load();


    musicTitle.textContent =
        song.title ||
        "Sem título";


    musicArtist.textContent =
        song.artist ||
        "Artista desconhecido";


    musicCover.src =
        song.cover ||
        "https://placehold.co/100x100/111/fff?text=♫";


    progress.style.width =
        "0%";


    time.textContent =
        "0:00 / 0:00";


    if (autoPlay) {

        audio.play()
            .then(() => {

                playBtn.textContent =
                    "⏸";

            })
            .catch(() => {

                playBtn.textContent =
                    "▶";

            });

    } else {

        playBtn.textContent =
            "▶";

    }

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

playBtn.addEventListener(
    "click",
    () => {

        if (!playlist.length) {
            return;
        }


        if (audio.paused) {

            audio.play()
                .then(() => {

                    playBtn.textContent =
                        "⏸";

                })
                .catch(() => {

                    playBtn.textContent =
                        "▶";

                });

        } else {

            audio.pause();

            playBtn.textContent =
                "▶";

        }

    }
);


/* =====================================================
   PRÓXIMA
===================================================== */

nextBtn.addEventListener(
    "click",
    () => {

        if (!playlist.length) {
            return;
        }


        let next =
            currentSong + 1;


        if (
            next >= playlist.length
        ) {

            if (playlistLoop) {

                next = 0;

            } else {

                audio.pause();

                playBtn.textContent =
                    "▶";

                return;

            }

        }


        loadSong(
            next,
            true
        );

    }
);


/* =====================================================
   ANTERIOR
===================================================== */

prevBtn.addEventListener(
    "click",
    () => {

        if (!playlist.length) {
            return;
        }


        let previous =
            currentSong - 1;


        if (previous < 0) {

            previous =
                playlist.length - 1;

        }


        loadSong(
            previous,
            true
        );

    }
);


/* =====================================================
   FINAL DA MÚSICA
===================================================== */

audio.addEventListener(
    "ended",
    () => {

        if (audio.loop) {
            return;
        }


        let next =
            currentSong + 1;


        if (
            next >= playlist.length
        ) {

            if (playlistLoop) {

                next = 0;

            } else {

                playBtn.textContent =
                    "▶";

                return;

            }

        }


        loadSong(
            next,
            true
        );

    }
);


/* =====================================================
   PROGRESSO
===================================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration) {
            return;
        }


        const percent =
            (audio.currentTime /
            audio.duration) * 100;


        progress.style.width =
            `${percent}%`;


        time.textContent =
            `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;

    }
);


progressContainer.addEventListener(
    "click",
    event => {

        if (!audio.duration) {
            return;
        }


        const rect =
            progressContainer
                .getBoundingClientRect();


        const percent =
            (event.clientX -
            rect.left) /
            rect.width;


        audio.currentTime =
            percent *
            audio.duration;

    }
);


function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }


    const minutes =
        Math.floor(seconds / 60);


    const secs =
        Math.floor(seconds % 60);


    return `${minutes}:${String(secs).padStart(2, "0")}`;

}

function createLinkEditor(

    link = {},
    index = Date.now()
) {

        document.createElement("div");

    wrapper.innerHTML = `

            placeholder="Nome"
            value="${escapeHTML(link.name || "")}"

            class="input link-url"
            placeholder="https://..."

        .querySelector(".remove-link")

        );


    container.appendChild(

    );

}

/* =====================================================

===================================================== */

document
    .getElementById("saveBtn")
    .addEventListener(
        "click",
        async () => {

            if (!auth.currentUser) {

                alert(
                    "Você não está autenticado."
                );

                return;

            }


            const saveStatus =
                document.getElementById(
                    "saveStatus"
                );


            saveStatus.textContent =
                "Salvando...";


            const newLinks = [];


            document
                .querySelectorAll(
                    "#linksEditor .song-editor"
                )
                .forEach(
                    item => {

                        const name =
                            item
                                .querySelector(
                                    ".link-name"
                                )
                                .value
                                .trim();


                        const url =
                            item
                                .querySelector(
                                    ".link-url"
                                )
                                .value
                                .trim();


                        if (url) {

                            newLinks.push({

                                name:
                                    name ||
                                    "Link",

                                url:
                                    url

                            });

                        }

                    }
                );


            const newSongs = [];


            document
                .querySelectorAll(
                    "#songsEditor .song-editor"
                )
                .forEach(
                    item => {

                        const title =
                            item
                                .querySelector(
                                    ".song-title"
                                )
                                .value
                                .trim();


                        const artist =
                            item
                                .querySelector(
                                    ".song-artist"
                                )
                                .value
                                .trim();


                        const url =
                            item
                                .querySelector(
                                    ".song-url"
                                )
                                .value
                                .trim();


                        const cover =
                            item
                                .querySelector(
                                    ".song-cover"
                                )
                                .value
                                .trim();


                        if (url) {

                            newSongs.push({

                                title:
                                    title ||
                                    "Sem título",

                                artist:
                                    artist ||
                                    "Artista desconhecido",

                                url:
                                    url,

                                cover:
                                    cover

                            });

                        }

                    }
                );


            const newData = {

                username:
                    document
                        .getElementById(
                            "editUsername"
                        )
                        .value
                        .trim(),

                avatar:
                    document
                        .getElementById(
                            "editAvatar"
                        )
                        .value
                        .trim(),

                background:
                    document
                        .getElementById(
                            "editBackground"
                        )
                        .value
                        .trim(),

                description:
                    document
                        .getElementById(
                            "editDescription"
                        )
                        .value,

                primary:
                    document
                        .getElementById(
                            "editPrimary"
                        )
                        .value,

                links:
                    newLinks,

                songs:
                    newSongs,

                stats:
                    profileData.stats || {

                        views: 0,

                        likes: 0,

                        followers: 0

                    }

            };


            try {

                await set(
                    profileRef,
                    newData
                );


                saveStatus.textContent =
                    "✓ Perfil atualizado com sucesso.";


                setTimeout(
                    () => {

                        saveStatus.textContent =
                            "";

                    },
                    3000
                );


            } catch (error) {

                console.error(error);

                saveStatus.textContent =
                    "Erro ao salvar. Verifique as regras do Firebase.";

            }

        }
    );

/* =====================================================
   SEGURANÇA DE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


/* =====================================================
   AUTOPLAY
===================================================== */

document.addEventListener(
    "click",
    () => {

        /*
         * O navegador geralmente bloqueia

         * do visitante, podemos tentar tocar.
         */

        if (

            audio.paused &&
            !audio.currentTime
        ) {

                .then(() => {

                    playBtn.textContent =
                        "⏸";

                })
                .catch(() => {

                    /*
                     * Autoplay bloqueado.
                     * O botão Play continua disponível.
                     */

                });

        }

    },
    {
        once: true
    }
);
