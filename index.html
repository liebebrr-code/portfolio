<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Perfil ✨</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --primary: #8b5cf6;
    --secondary: #06b6d4;
    --accent: #a78bfa;
    --text: #ffffff;
    --muted: #a1a1aa;
    --card: rgba(15, 15, 25, .72);
    --border: rgba(255,255,255,.12);
    --blur: 18px;
    --radius: 24px;
    --cursor-url: default;
}

html, body { width: 100%; min-height: 100%; }

body {
    background: #050509;
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow-x: hidden;
    cursor: var(--cursor-url);
}

/* =========================================================
   FUNDO COM PARTÍCULAS
========================================================= */

#background {
    position: fixed;
    inset: 0;
    z-index: -10;
    background:
        radial-gradient(circle at center, rgba(139,92,246,.15), transparent 55%),
        #050509;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: background-image 1.2s ease, opacity 1s ease, filter .5s ease;
}

#background::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.7));
}

#background.blur { filter: blur(8px); transform: scale(1.05); }

#particles {
    position: fixed;
    inset: 0;
    z-index: -8;
    pointer-events: none;
    opacity: .6;
}

#overlay {
    position: fixed;
    inset: 0;
    z-index: -5;
    pointer-events: none;
    background: radial-gradient(circle at 50% 20%, rgba(139,92,246,.18), transparent 45%);
}

/* =========================================================
   CURSOR PERSONALIZADO
========================================================= */

.custom-cursor {
    position: fixed;
    width: 20px;
    height: 20px;
    border: 2px solid var(--primary);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width .2s, height .2s, background .2s;
    mix-blend-mode: difference;
}

.custom-cursor.hover {
    width: 40px;
    height: 40px;
    background: rgba(139,92,246,.3);
}

/* =========================================================
   PERFIL
========================================================= */

.profile-wrapper {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 18px;
}

.profile-card {
    width: min(760px, 100%);
    padding: 34px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    box-shadow: 0 30px 100px rgba(0,0,0,.55), 0 0 80px rgba(139,92,246,.08);
    animation: cardIn .8s ease;
    position: relative;
    overflow: hidden;
}

.profile-card::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(from 0deg, transparent, var(--primary), transparent, var(--secondary), transparent);
    animation: rotate 8s linear infinite;
    opacity: .05;
    z-index: -1;
}

@keyframes rotate { to { transform: rotate(360deg); } }

@keyframes cardIn {
    from { opacity: 0; transform: translateY(25px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* =========================================================
   AVATAR COM ANEL GIRATÓRIO
========================================================= */

.avatar-container {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
    position: relative;
}

.avatar-ring {
    position: absolute;
    width: 145px;
    height: 145px;
    border-radius: 50%;
    background: conic-gradient(var(--primary), var(--secondary), var(--primary));
    animation: spin-ring 4s linear infinite;
    opacity: .7;
    filter: blur(3px);
}

@keyframes spin-ring { to { transform: rotate(360deg); } }

.avatar {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid rgba(255,255,255,.15);
    box-shadow: 0 0 0 5px rgba(139,92,246,.08), 0 15px 50px rgba(0,0,0,.5);
    background: #111;
    position: relative;
    z-index: 2;
    transition: transform .3s;
}

.avatar:hover { transform: scale(1.05) rotate(3deg); }

/* =========================================================
   TEXTO
========================================================= */

.profile-name {
    text-align: center;
    font-size: clamp(30px, 6vw, 48px);
    font-weight: 900;
    letter-spacing: -1px;
    margin-bottom: 8px;
    text-shadow: 0 0 25px rgba(139,92,246,.35);
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.profile-description {
    text-align: center;
    color: var(--muted);
    line-height: 1.6;
    max-width: 600px;
    margin: auto;
    white-space: pre-wrap;
}

/* =========================================================
   BADGES
========================================================= */

.badges {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 18px;
}

.badge {
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(139,92,246,.15);
    border: 1px solid rgba(139,92,246,.25);
    font-size: 13px;
    color: #ddd6fe;
    transition: .2s;
}

.badge:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 5px 20px rgba(139,92,246,.3);
}

/* =========================================================
   LINKS
========================================================= */

.links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 30px;
}

.social-link {
    width: 100%;
    padding: 15px 18px;
    border-radius: 16px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    color: white;
    text-decoration: none;
    text-align: center;
    font-weight: 700;
    transition: .25s;
    position: relative;
    overflow: hidden;
}

.social-link::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(139,92,246,.3), transparent);
    transition: left .5s;
}

.social-link:hover::before { left: 100%; }

.social-link:hover {
    transform: translateY(-3px);
    background: rgba(139,92,246,.18);
    border-color: rgba(139,92,246,.4);
    box-shadow: 0 10px 35px rgba(139,92,246,.12);
}

/* =========================================================
   DISCO DE VINIL
========================================================= */

.vinyl-container {
    display: flex;
    justify-content: center;
    margin: 25px 0;
    perspective: 1000px;
}

.vinyl {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 30%, #111 31%, #0a0a0a 32%, #111 33%, #0a0a0a 34%, #111 35%, #0a0a0a 36%, #111 37%, #0a0a0a 38%, #111 39%, #0a0a0a 40%, #111 41%, #0a0a0a 42%, #111 43%, #0a0a0a 44%, #111 45%, #0a0a0a 46%, #111 47%, #0a0a0a 48%, #111 49%, #0a0a0a 50%, #111 51%, #0a0a0a 52%, #111 53%, #0a0a0a 54%, #111 55%, #0a0a0a 56%, #111 57%, #0a0a0a 58%, #111 59%, #0a0a0a 60%, #111 61%, #0a0a0a 62%, #111 63%, #0a0a0a 64%, #111 65%, #0a0a0a 66%, #111 67%, #0a0a0a 68%, #111 69%, #0a0a0a 70%, #111 71%, #0a0a0a 72%, #111 73%, #0a0a0a 74%, #111 75%, #0a0a0a 76%, #111 77%, #0a0a0a 78%, #111 79%, #0a0a0a 80%, #111 81%, #0a0a0a 82%, #111 83%, #0a0a0a 84%, #111 85%, #0a0a0a 86%, #111 87%, #0a0a0a 88%, #111 89%, #0a0a0a 90%, #111 91%, #0a0a0a 92%, #111 93%, #0a0a0a 94%, #111 95%, #0a0a0a 96%, #111 97%, #0a0a0a 98%, #111 99%, #0a0a0a 100%);
    box-shadow: 0 10px 40px rgba(0,0,0,.6), inset 0 0 20px rgba(0,0,0,.8);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .3s;
}

.vinyl::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.1), transparent 50%);
    pointer-events: none;
}

.vinyl.spinning {
    animation: vinyl-spin 2s linear infinite;
}

@keyframes vinyl-spin { to { transform: rotate(360deg); } }

.vinyl-label {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,.2);
    box-shadow: 0 0 15px var(--primary);
}

.vinyl-label img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.vinyl-center {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #000;
    z-index: 3;
}

/* =========================================================
   PLAYER
========================================================= */

.music-player {
    margin-top: 20px;
    padding: 18px;
    border-radius: 20px;
    background: rgba(0,0,0,.25);
    border: 1px solid rgba(255,255,255,.08);
}

.music-title {
    font-weight: 800;
    margin-bottom: 12px;
    text-align: center;
    font-size: 14px;
    color: var(--accent);
}

.music-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

.music-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(139,92,246,.2);
    color: white;
    cursor: pointer;
    transition: .2s;
    font-size: 16px;
}

.music-btn:hover {
    background: rgba(139,92,246,.4);
    transform: scale(1.05);
}

.music-progress {
    flex: 1;
    height: 5px;
    appearance: none;
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    cursor: pointer;
}

.music-progress::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 10px var(--primary);
}

.volume { width: 90px; }

.music-time {
    display: flex;
    justify-content: space-between;
    color: #a1a1aa;
    font-size: 12px;
    margin-top: 8px;
}

.playlist {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    max-height: 160px;
    overflow-y: auto;
}

.playlist-item {
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    color: #aaa;
    transition: .2s;
    font-size: 13px;
}

.playlist-item:hover,
.playlist-item.active {
    background: rgba(139,92,246,.14);
    color: white;
}

/* =========================================================
   BOTÕES FLUTUANTES
========================================================= */

.float-buttons {
    position: fixed;
    right: 18px;
    bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 100;
}

.float-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(10,10,15,.75);
    backdrop-filter: blur(12px);
    color: white;
    cursor: pointer;
    font-size: 18px;
    transition: .25s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.float-btn:hover {
    transform: scale(1.1) rotate(5deg);
    background: rgba(139,92,246,.3);
}

/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(10px);
}

.modal.show { display: flex; }

.modal-box {
    width: min(900px, 100%);
    max-height: 92vh;
    overflow-y: auto;
    padding: 25px;
    border-radius: 24px;
    background: #0c0c13;
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 30px 100px rgba(0,0,0,.7);
    animation: cardIn .4s ease;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.modal-header h2 { font-size: 24px; }

.close {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
    color: white;
    cursor: pointer;
    font-size: 20px;
}

/* =========================================================
   LOGIN E INPUTS
========================================================= */

.login-box { width: min(420px, 100%); }

.input {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.1);
    background: #14141d;
    color: white;
    outline: none;
    font-family: inherit;
}

.input:focus { border-color: var(--primary); }

textarea.input { min-height: 120px; resize: vertical; }

.primary-button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
}

.primary-button:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

/* =========================================================
   ADMIN
========================================================= */

.admin-section {
    padding: 18px;
    margin-bottom: 14px;
    border-radius: 17px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.07);
}

.admin-section h3 { margin-bottom: 15px; }

.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.file-input {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    background: #14141d;
    border: 1px dashed rgba(255,255,255,.15);
    color: #aaa;
    margin-bottom: 10px;
}

.admin-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.admin-item {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.04);
}

.admin-item input { flex: 1; }

.small-button {
    padding: 10px 13px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,.08);
    color: white;
    cursor: pointer;
}

.danger { background: rgba(239,68,68,.15); }

.checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
    color: #ccc;
}

/* =========================================================
   LOADING
========================================================= */

#loading {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050509;
    transition: opacity .4s;
}

#loading.hide { opacity: 0; pointer-events: none; }

.loader {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.1);
    border-top-color: var(--primary);
    animation: spin .8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* =========================================================
   TOAST
========================================================= */

#toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%) translateY(30px);
    padding: 12px 18px;
    border-radius: 12px;
    background: #15151e;
    border: 1px solid rgba(255,255,255,.1);
    color: white;
    opacity: 0;
    pointer-events: none;
    transition: .3s;
    z-index: 2000;
}

#toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* =========================================================
   EFEITOS
========================================================= */

.fade-in-music {
    animation: fadeInMusic 3s ease forwards;
}

@keyframes fadeInMusic {
    from { opacity: 0; }
    to { opacity: 1; }
}

.glow-text {
    text-shadow: 0 0 15px var(--primary), 0 0 40px var(--primary) !important;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px) {
    .grid { grid-template-columns: 1fr; }
    .profile-card { padding: 22px; }
    .music-controls { flex-wrap: wrap; }
    .volume { width: 100%; }
    .custom-cursor { display: none; }
}
</style>
</head>

<body>

<div id="background"></div>
<canvas id="particles"></canvas>
<div id="overlay"></div>
<div class="custom-cursor" id="cursor"></div>

<div id="loading"><div class="loader"></div></div>

<main class="profile-wrapper">
    <section class="profile-card">
        <div class="avatar-container">
            <div class="avatar-ring"></div>
            <img id="avatar" class="avatar" src="" alt="Avatar">
        </div>

        <h1 id="profileName" class="profile-name">Carregando...</h1>
        <p id="profileDescription" class="profile-description"></p>
        <div id="badges" class="badges"></div>
        <div id="links" class="links"></div>

        <!-- DISCO DE VINIL -->
        <div id="vinylContainer" class="vinyl-container" style="display:none">
            <div id="vinyl" class="vinyl" onclick="togglePlay()">
                <div class="vinyl-label" id="vinylLabel">
                    <img id="vinylCover" src="" alt="">
                </div>
                <div class="vinyl-center"></div>
            </div>
        </div>

        <div id="musicPlayer" class="music-player" style="display:none">
            <div id="musicTitle" class="music-title">Música</div>
            <div class="music-controls">
                <button id="prevBtn" class="music-btn">⏮</button>
                <button id="playBtn" class="music-btn">▶</button>
                <button id="nextBtn" class="music-btn">⏭</button>
                <input id="progress" class="music-progress" type="range" min="0" max="100" value="0">
                <input id="volume" class="volume" type="range" min="0" max="1" step=".01" value=".7">
            </div>
            <div class="music-time">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div id="playlist" class="playlist"></div>
        </div>
    </section>
</main>

<div class="float-buttons">
    <button id="adminButton" class="float-btn" title="Administrador">⚙</button>
    <button id="themeToggle" class="float-btn" title="Alternar tema">🌙</button>
</div>

<!-- LOGIN -->
<div id="loginModal" class="modal">
    <div class="modal-box login-box">
        <div class="modal-header">
            <h2>🔐 Administrador</h2>
            <button class="close" onclick="closeModal('loginModal')">×</button>
        </div>
        <input id="loginEmail" class="input" type="email" placeholder="E-mail">
        <input id="loginPassword" class="input" type="password" placeholder="Senha">
        <button id="loginButton" class="primary-button">Entrar</button>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminModal" class="modal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>👑 Painel do Administrador</h2>
            <button class="close" onclick="closeModal('adminModal')">×</button>
        </div>

        <div class="admin-section">
            <h3>👤 Perfil</h3>
            <div class="grid">
                <input id="editName" class="input" placeholder="Nome">
                <input id="editTitle" class="input" placeholder="Título">
            </div>
            <textarea id="editDescription" class="input" placeholder="Descrição"></textarea>
            <label>Avatar</label>
            <input id="avatarFile" class="file-input" type="file" accept="image/*">
        </div>

        <div class="admin-section">
            <h3>🎨 Aparência</h3>
            <div class="grid">
                <input id="primaryColor" class="input" type="color" value="#8b5cf6">
                <input id="secondaryColor" class="input" type="color" value="#06b6d4">
            </div>
            <label>Fundos</label>
            <input id="backgroundFiles" class="file-input" type="file" accept="image/*" multiple>
            <div id="backgroundList" class="admin-list"></div>
            <div class="grid">
                <input id="backgroundInterval" class="input" type="number" min="1" placeholder="Tempo do fundo (segundos)">
                <input id="blurAmount" class="input" type="number" min="0" max="30" placeholder="Blur">
            </div>
        </div>

        <div class="admin-section">
            <h3>🔗 Links</h3>
            <div id="linksEditor" class="admin-list"></div>
            <button id="addLink" class="small-button">+ Adicionar link</button>
        </div>

        <div class="admin-section">
            <h3>🏷️ Badges</h3>
            <input id="badgeInput" class="input" placeholder="Ex: Developer">
            <button id="addBadge" class="small-button">+ Adicionar badge</button>
            <div id="badgesEditor" class="admin-list"></div>
        </div>

        <div class="admin-section">
            <h3>🎵 Playlist</h3>
            <input id="musicFiles" class="file-input" type="file" accept="audio/*" multiple>
            <div id="musicEditor" class="admin-list"></div>
            <label class="checkbox-row">
                <input id="musicAutoplay" type="checkbox"> Reprodução automática
            </label>
            <label class="checkbox-row">
                <input id="musicLoop" type="checkbox" checked> Repetir playlist
            </label>
            <label class="checkbox-row">
                <input id="musicShuffle" type="checkbox"> Embaralhar músicas
            </label>
            <label class="checkbox-row">
                <input id="musicChangeBackground" type="checkbox"> Trocar fundo junto com a música
            </label>
            <label class="checkbox-row">
                <input id="musicFadeIn" type="checkbox" checked> Fade-in de música
            </label>
        </div>

        <div class="admin-section">
            <h3>🎬 YouTube (opcional)</h3>
            <input id="youtubeUrl" class="input" placeholder="https://youtube.com/watch?v=...">
            <label class="checkbox-row">
                <input id="youtubeLoop" type="checkbox" checked> Repetir YouTube
            </label>
        </div>

        <div class="admin-section">
            <h3>✨ Efeitos</h3>
            <label class="checkbox-row">
                <input id="effectGlow" type="checkbox" checked> Glow no nome
            </label>
            <label class="checkbox-row">
                <input id="effectBlur" type="checkbox"> Blur no fundo
            </label>
            <label class="checkbox-row">

/* =========================================================

const canvas = $("particles");
const ctx = canvas.getContext("2d");
let particles = [];

function initParticles() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    particles = [];
    const count = Math.min(80, Math.floor(window.innerWidth / 15));
    for (let i = 0; i < count; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            r: Math.random() * 2 + 0.5,
            color: Math.random() > 0.5 ? "139,92,246" : "6,182,212"
        });
    }
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.color},0.6)`;
        ctx.fill();
    });
    // linhas entre partículas próximas
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(139,92,246,${0.15 * (1 - dist / 120)})`;
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animateParticles);
}

if (window.matchMedia("(prefers-reduced-motion: no-preference)").matches) {
    initParticles();
    animateParticles();
    window.addEventListener("resize", initParticles);
}

function fileToDataURL(file) {

        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function startBackgrounds() {

    changeBackground();

}

function changeBackground() {
    if (!backgrounds.length) return;

    $("background").style.opacity = "0";

/* =========================================================
   FADE IN DE MÚSICA
========================================================= */
function fadeInMusic() {
    if (!profile.musicFadeIn) {
        audio.volume = Number($("volume").value);
        return;
    }
    clearInterval(fadeInterval);
    const targetVolume = Number($("volume").value);
    audio.volume = 0;
    const steps = 30;
    let step = 0;
    fadeInterval = setInterval(() => {
        step++;
        audio.volume = Math.min(targetVolume, (step / steps) * targetVolume);
        if (step >= steps) clearInterval(fadeInterval);
    }, 100);
}

function fadeOutMusic(callback) {
    if (!profile.musicFadeIn) {
        audio.pause();
        if (callback) callback();
        return;
    }
    clearInterval(fadeInterval);
    const startVolume = audio.volume;
    const steps = 20;
    let step = 0;
    fadeInterval = setInterval(() => {
        step++;
        audio.volume = Math.max(0, startVolume * (1 - step / steps));
        if (step >= steps) {
            clearInterval(fadeInterval);
            audio.pause();
            audio.volume = Number($("volume").value);
            if (callback) callback();
        }
    }, 80);
}

/* =========================================================
   PLAY / PAUSE
========================================================= */
function playMusic() {
    audio.play().then(() => {
        isPlaying = true;
        $("playBtn").textContent = "⏸";
        $("vinyl").classList.add("spinning");
        fadeInMusic();
    }).catch(error => {
        console.log("Autoplay bloqueado:", error);
    });
}

function pauseMusic() {
    fadeOutMusic(() => {
        isPlaying = false;
        $("playBtn").textContent = "▶";
        $("vinyl").classList.remove("spinning");
    });
}

function togglePlay() {
    if (isPlaying) pauseMusic();
    else playMusic();
}

$("playBtn").onclick = togglePlay;

$("prevBtn").onclick = () => {
    if (!playlist.length) return;
    currentSong--;
    if (currentSong < 0) currentSong = playlist.length - 1;
    loadSong();
    playMusic();
};

$("nextBtn").onclick = () => nextSong();

function nextSong() {
    if (!playlist.length) return;

    if (profile.shuffle) {
        let next;
        do {
            next = Math.floor(Math.random() * playlist.length);
        } while (playlist.length > 1 && next === currentSong);
        currentSong = next;
    } else {
        currentSong++;
        if (currentSong >= playlist.length) {
            if (profile.loop) {
                currentSong = 0;
            } else {
                currentSong = playlist.length - 1;
                pauseMusic();
                return;
            }
        }
    }

    loadSong();
    playMusic();
}

audio.addEventListener("ended", nextSong);

audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;
    $("progress").value = (audio.currentTime / audio.duration) * 100;
    $("currentTime").textContent = formatTime(audio.currentTime);
    $("duration").textContent = formatTime(audio.duration);
});

$("progress").oninput = () => {
    if (!audio.duration) return;
    audio.currentTime = (Number($("progress").value) / 100) * audio.duration;
};

$("volume").oninput = () => {
    if (!profile.musicFadeIn || !fadeInterval) {
        audio.volume = Number($("volume").value);
    }
};

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";
    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
    return `${minutes}:${secs}`;
}

/* =========================================================
   YOUTUBE
========================================================= */
let ytPlayer = null;
let ytReady = false;

function setupYouTube() {
    if (!profile.youtubeUrl) return;

    const container = $("youtubeContainer");
    container.innerHTML = '<div id="ytPlayer"></div>';

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    window.onYouTubeIframeAPIReady = () => {
        const videoId = extractYouTubeId(profile.youtubeUrl);
        if (!videoId) return;

        ytPlayer = new YT.Player("ytPlayer", {
            height: "1",
            width: "1",
            videoId: videoId,
            playerVars: {
                autoplay: 0,
                loop: profile.youtubeLoop ? 1 : 0,
                playlist: videoId,
                controls: 0
            },
            events: {
                onReady: () => { ytReady = true; }
            }
        });
    };
}

function extractYouTubeId(url) {
    const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
    return match ? match[1] : null;
}

        });

        profile.name = $("editName").value;
        profile.title = $("editTitle").value;
        profile.description = $("editDescription").value;
        profile.primary = $("primaryColor").value;
        profile.secondary = $("secondaryColor").value;
        profile.backgrounds = backgrounds;
        profile.backgroundInterval = Number($("backgroundInterval").value) || 8;
        profile.blur = Number($("blurAmount").value) || 0;
        profile.links = links;
        profile.badges = badges;
        profile.playlist = playlist;
        profile.autoplay = $("musicAutoplay").checked;
        profile.loop = $("musicLoop").checked;
        profile.shuffle = $("musicShuffle").checked;
        profile.musicChangeBackground = $("musicChangeBackground").checked;
        profile.musicFadeIn = $("musicFadeIn").checked;
        profile.glow = $("effectGlow").checked;
        profile.effectBlur = $("effectBlur").checked;
        profile.effectParticles = $("effectParticles").checked;
        profile.effectVinyl = $("effectVinyl").checked;
        profile.effectCursor = $("effectCursor").checked;
        profile.effectRing = $("effectRing").checked;
        profile.youtubeUrl = $("youtubeUrl").value.trim();
        profile.youtubeLoop = $("youtubeLoop").checked;

        await db.ref(PROFILE_PATH).set(profile);
        applyProfile();
        closeModal("adminModal");
        toast("👑 Perfil atualizado para todo mundo.");
    } catch (error) {
        console.error(error);
        toast("Erro ao salvar. Veja o console.");
    }
};

/* =========================================================
   LOGOUT
========================================================= */
$("logoutButton").onclick = async () => {
    await auth.signOut();
    closeModal("adminModal");
    toast("Administrador desconectado.");
};

/* =========================================================
   ESCAPE
========================================================= */
function escapeHTML(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* =========================================================
   AUTOPLAY
========================================================= */
document.addEventListener("click", () => {
    if (profile && profile.autoplay && playlist.length && !isPlaying) {
        playMusic();
    }
    if (profile && profile.youtubeUrl && ytReady && ytPlayer && typeof ytPlayer.playVideo === "function") {
        ytPlayer.playVideo();
    }
}, { once: true });

/* =========================================================
   INICIALIZAÇÃO
========================================================= */
loadProfile();
</script>
