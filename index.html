<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Perfil • Experiência</title>
<meta name="theme-color" content="#050509">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#8b5cf6;--secondary:#06b6d4;--pc:139,92,246;--bg:#050509;--muted:#a1a1aa;--card:rgba(15,15,25,.72);--border:rgba(255,255,255,.12);--radius:24px;--blur:18px;--card-w:760px;--dim:.5;--av:125px;--av-r:50%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .6s}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
#bg,#bgv{position:fixed;inset:0;z-index:-10;width:100%;height:100%;object-fit:cover;transition:opacity 1s}
#bg{background:radial-gradient(circle at center,rgba(var(--pc),.15),transparent 55%) center/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,calc(var(--dim)*.7)),rgba(0,0,0,var(--dim)))}
#bg.off{opacity:0}#bgv{display:none}#bgv.on{display:block}
#fx{position:fixed;inset:0;z-index:-8;pointer-events:none}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--primary),var(--secondary));z-index:3000;box-shadow:0 0 12px var(--primary)}
#cur{position:fixed;width:var(--cs,22px);height:var(--cs,22px);border:2px solid var(--primary);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:difference;opacity:0;transition:width .2s,height .2s,background .2s}
#cur.hover{width:calc(var(--cs,22px)*1.8);height:calc(var(--cs,22px)*1.8);background:rgba(var(--pc),.3)}
body.nc,body.nc *{cursor:none!important}
.trail{position:fixed;width:8px;height:8px;border-radius:50%;background:var(--primary);pointer-events:none;z-index:9998;opacity:.55;transform:translate(-50%,-50%);transition:opacity .7s}
.rip{position:fixed;border:2px solid var(--primary);border-radius:50%;pointer-events:none;z-index:9997;transform:translate(-50%,-50%);animation:rip .7s ease-out forwards}
@keyframes rip{from{width:0;height:0;opacity:.9}to{width:120px;height:120px;opacity:0}}

.wrap{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:40px 18px}
.card{width:min(var(--card-w),100%);padding:34px;background:rgba(var(--card-rgb,15,15,25),var(--card-a,.72));border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:0 30px 100px rgba(0,0,0,.55),0 0 80px rgba(var(--pc),.08);animation:pop .8s ease}
@keyframes pop{from{opacity:0;transform:translateY(25px) scale(.97)}}
.av-wrap{display:flex;justify-content:center;margin-bottom:14px;position:relative}
.ring{position:absolute;width:calc(var(--av) + 20px);height:calc(var(--av) + 20px);border-radius:var(--av-r);background:conic-gradient(var(--primary),var(--secondary),var(--primary));animation:spin 4s linear infinite;opacity:.7;filter:blur(3px);top:50%;left:50%;margin:calc((var(--av) + 20px)/-2) 0 0 calc((var(--av) + 20px)/-2)}
.ring.off{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
#av{width:var(--av);height:var(--av);border-radius:var(--av-r);object-fit:cover;border:4px solid rgba(255,255,255,.15);background:#111;position:relative;z-index:2;opacity:0;transition:transform .3s,opacity .6s}
#av.ok{opacity:1}#av.click{cursor:pointer}#av.click:hover{transform:scale(1.06) rotate(3deg)}
.more{display:block;margin:0 auto 14px;padding:5px 14px;border-radius:999px;border:1px solid rgba(var(--pc),.35);background:rgba(var(--pc),.12);color:#ddd6fe;font-weight:700;font-size:12px;transition:.25s}
.more:hover{background:rgba(var(--pc),.3);transform:translateY(-2px)}
h1{text-align:center;font-size:clamp(30px,6vw,48px);font-weight:900;letter-spacing:-1px;margin-bottom:8px;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1.glow{filter:drop-shadow(0 0 15px var(--primary))}
.sub{text-align:center;color:var(--primary);font-weight:700;font-size:13px;margin-bottom:6px}
.desc{text-align:center;color:var(--muted);line-height:1.6;max-width:600px;margin:auto;white-space:pre-wrap}
nav{display:flex;gap:6px;margin:22px auto 18px;padding:6px;background:rgba(0,0,0,.25);border-radius:16px;border:1px solid rgba(255,255,255,.06);max-width:480px}
.tab{flex:1;padding:10px 12px;border:0;background:transparent;color:var(--muted);border-radius:10px;font-weight:700;font-size:13px;transition:.25s}
.tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.tab.on{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 15px rgba(var(--pc),.3)}
.page{display:none}.page.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.badge{padding:7px 12px;border-radius:999px;background:rgba(var(--pc),.15);border:1px solid rgba(var(--pc),.25);font-size:13px;color:#ddd6fe}
.links{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.lnk{padding:15px 18px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;text-decoration:none;text-align:center;font-weight:700;transition:.25s}
.lnk:hover{transform:translateY(-3px);background:rgba(var(--pc),.18);border-color:rgba(var(--pc),.4);box-shadow:0 10px 35px rgba(var(--pc),.18)}
.ls-solid .lnk{background:linear-gradient(135deg,var(--primary),var(--secondary));border-color:transparent}
.ls-outline .lnk{background:transparent;border:2px solid var(--primary)}

/* vinil */
.vwrap{position:relative;display:flex;justify-content:center;margin:26px 0 22px}
.vinyl{width:150px;height:150px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;
 background:radial-gradient(circle,#1c1c1c 0 24%,transparent 25%),repeating-radial-gradient(circle,#0a0a0a 0 2px,#161616 2px 4px);
 box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 0 20px rgba(0,0,0,.8);animation:spin 4s linear infinite;animation-play-state:paused;transition:box-shadow .6s}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.1),transparent 50%)}
.vwrap.play .vinyl{animation-play-state:running;box-shadow:0 0 45px var(--vglow,var(--primary)),inset 0 0 20px rgba(0,0,0,.8)}
.vlabel{width:64%;height:64%;border-radius:50%;overflow:hidden;background:var(--primary);border:3px solid #111;z-index:1}
.vlabel img{width:100%;height:100%;object-fit:cover;display:block}
.vlabel img.swap{animation:cin .5s ease}
@keyframes cin{from{opacity:0;transform:scale(.6)}}
.vhole{position:absolute;pointer-events:auto;cursor:pointer;width:12px;height:12px;border-radius:50%;background:#000;z-index:3}
.arm{position:absolute;top:-8px;left:calc(50% + 80px);width:5px;height:100px;border-radius:4px;background:linear-gradient(#eee,#777);transform-origin:50% 5px;transform:rotate(-12deg);transition:transform .7s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:4;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.arm::after{content:"";position:absolute;bottom:-5px;left:-3px;width:11px;height:15px;border-radius:3px;background:#ccc}
.vwrap.play .arm{transform:rotate(20deg)}
.player{padding:18px;border-radius:20px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08)}
.mt{font-weight:800;margin-bottom:12px;text-align:center;font-size:14px;color:#a78bfa;display:flex;justify-content:center;align-items:center;gap:8px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--primary);border-radius:2px;height:4px}
.eq.play i{animation:eq .7s ease-in-out infinite}.eq.play i:nth-child(2){animation-duration:.5s}.eq.play i:nth-child(3){animation-duration:.9s}
@keyframes eq{50%{height:14px}}
.ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mb{width:40px;height:40px;border:0;border-radius:50%;background:rgba(var(--pc),.2);color:#fff;font-size:15px;transition:.2s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mb:hover{background:rgba(var(--pc),.4);transform:scale(1.08)}.mb.on{background:var(--primary);box-shadow:0 0 15px var(--primary)}
input[type=range]{appearance:none;height:5px;border-radius:999px;background:rgba(255,255,255,.12);cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:var(--primary);box-shadow:0 0 10px var(--primary)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--primary)}
#prg{flex:1;min-width:100px}#vol{width:80px}
.times{display:flex;justify-content:space-between;color:#a1a1aa;font-size:12px;margin-top:8px}
.pl{margin-top:14px;display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto}
.pi{padding:9px 12px;border-radius:10px;cursor:pointer;color:#aaa;font-size:13px;display:flex;align-items:center;gap:8px;transition:.2s}
.pi:hover,.pi.on{background:rgba(var(--pc),.14);color:#fff}.pi.on{box-shadow:inset 3px 0 0 var(--primary)}
.pi img{width:26px;height:26px;border-radius:6px;object-fit:cover;background:#111}
.pi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* fórum / amigos */
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding:8px;background:rgba(0,0,0,.2);border-radius:12px}
.ct{padding:8px 14px;border:0;border-radius:8px;background:rgba(255,255,255,.05);color:var(--muted);font-weight:700;font-size:12px}
.ct.on{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff}
.threads{display:flex;flex-direction:column;gap:12px}
.th{display:flex;gap:14px;padding:14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:14px;cursor:pointer;transition:.3s}
.th:hover{transform:translateY(-3px);border-color:rgba(var(--pc),.4);box-shadow:0 10px 30px rgba(var(--pc),.15)}
.th img,.th .ni{width:84px;height:84px;object-fit:cover;border-radius:10px;flex-shrink:0;background:rgba(var(--pc),.15);display:flex;align-items:center;justify-content:center;font-size:32px}
.th>div{flex:1;min-width:0}
.thh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:11px}
.tag{padding:3px 8px;border-radius:6px;background:rgba(var(--pc),.15);color:#a78bfa;font-weight:700}.pin{background:rgba(251,191,36,.15);color:#fbbf24}
.dt{color:var(--muted);margin-left:auto}
.th h3{font-size:15px;margin-bottom:4px}
.th p{font-size:12px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.fr{display:flex;gap:12px;padding:14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:14px;transition:.3s}
.fr:hover{border-color:rgba(var(--pc),.4);transform:translateY(-2px)}
.fav{position:relative;flex-shrink:0}.fav img{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#111}
.dot{position:absolute;bottom:2px;right:2px;width:14px;height:14px;border-radius:50%;border:2px solid #0c0c13}
.online{background:#23a55a}.idle{background:#f0b232}.dnd{background:#f23f43}.offline{background:#80848e}
.fi{min-width:0;flex:1}.fn{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd{font-size:12px;color:var(--muted);line-height:1.4}
.act{font-size:11px;color:#a78bfa;background:rgba(var(--pc),.1);padding:3px 8px;border-radius:6px;margin-top:4px;width:fit-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}.empty b{display:block;font-size:42px;opacity:.6;margin-bottom:12px}

/* flutuantes */
#mini{position:fixed;bottom:76px;right:18px;background:rgba(10,10,15,.92);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 6px 6px 8px;display:flex;align-items:center;gap:10px;z-index:99;max-width:280px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#mini.hide{display:none}
#mc{width:32px;height:32px;border-radius:50%;object-fit:cover;animation:spin 6s linear infinite;flex-shrink:0}
#mini .mi{min-width:0;flex:1}#mt2{font-size:12px;font-weight:700;color:#a78bfa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp{height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:3px;overflow:hidden}.mp div{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--secondary))}
#mini .mb{width:32px;height:32px;background:var(--primary);font-size:12px}
.fl{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:100}
.fb{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(10,10,15,.75);backdrop-filter:blur(12px);font-size:18px;transition:.25s}
.fb:hover{transform:scale(1.1) rotate(5deg);background:rgba(var(--pc),.3)}

/* modais */
.modal{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px)}
.modal.show{display:flex}.modal.closing{opacity:0;transition:opacity .25s}
.box{width:min(900px,100%);max-height:92vh;overflow-y:auto;padding:25px;border-radius:24px;background:#0c0c13;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 100px rgba(0,0,0,.7);animation:pop .4s ease;position:relative}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.mh h2{font-size:22px}
.x{width:40px;height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.06);font-size:20px;transition:.2s}.x:hover{background:rgba(239,68,68,.3);transform:rotate(90deg)}
.thread-img{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;margin-bottom:16px;background:#111}
.thread-txt{font-size:14px;line-height:1.7;color:#ddd;white-space:pre-wrap;word-break:break-word}

/* caixa de informações */
.ibox{position:relative;width:min(460px,100%);max-height:88vh;overflow-y:auto;padding:26px;border-radius:var(--radius);background:rgba(12,12,19,.94);border:1px solid var(--border);backdrop-filter:blur(var(--blur));box-shadow:0 30px 100px rgba(0,0,0,.7),0 0 60px rgba(var(--pc),.15)}
.ibox .x{position:absolute;top:14px;right:14px}
.ih{display:flex;gap:14px;align-items:center;margin-bottom:18px;padding-right:44px}
.ih img{width:68px;height:68px;object-fit:cover;border-radius:var(--av-r);border:3px solid rgba(var(--pc),.5)}
.ih h2{font-size:22px;line-height:1.2;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ist{font-size:12px;margin-top:5px;padding:3px 10px;border-radius:999px;background:rgba(var(--pc),.15);width:fit-content}
.is{margin-bottom:16px;animation:fade .4s ease both;animation-delay:calc(var(--i)*.07s + .2s)}.noanim .is{animation:none}
.is h4{font-size:12px;color:#a78bfa;margin-bottom:8px}
.ia{color:#ddd;font-size:14px;line-height:1.6;white-space:pre-wrap}
.if{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.04);font-size:13px;margin-bottom:6px}.if span{color:var(--muted)}
.istats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.istats div{text-align:center;padding:10px;border-radius:12px;background:rgba(var(--pc),.1)}.istats b{display:block;font-size:20px;color:var(--primary)}.istats small{font-size:11px;color:var(--muted)}
.ifr{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.ifr .fav img{width:42px;height:42px}.ifr .dot{width:12px;height:12px;right:-1px;bottom:-1px}
.inow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:rgba(0,0,0,.3)}
.inow img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#111}.inow div{flex:1;min-width:0}
.inow b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.inow small{color:var(--muted);font-size:11px}
.a-pop{animation:ibPop .5s cubic-bezier(.2,1.15,.3,1) both}.a-slide{animation:ibSlide .45s ease both}.a-flip{animation:ibFlip .6s ease both}.a-blur{animation:ibBlur .5s ease both}
.closing .ibox{animation:ibOut .25s ease forwards}
@keyframes ibPop{from{opacity:0;transform:scale(.05)}}
@keyframes ibSlide{from{opacity:0;transform:translateY(60px)}}
@keyframes ibFlip{from{opacity:0;transform:perspective(900px) rotateY(-80deg)}}
@keyframes ibBlur{from{opacity:0;filter:blur(18px);transform:scale(1.15)}}
@keyframes ibOut{to{opacity:0;transform:scale(.8)}}

/* admin */
.sec{padding:18px;margin-bottom:14px;border-radius:17px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.sec h3{margin-bottom:14px;font-size:15px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.sec h4{font-size:13px;color:#a78bfa;margin:14px 0 8px}
.inp{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#14141d;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--primary)}textarea.inp{min-height:90px;resize:vertical}input[type=color].inp{padding:4px;height:44px}
.cap{display:block;font-size:12px;color:#aaa;margin-bottom:4px}
.chk{display:flex;align-items:center;gap:10px;margin:10px 0;color:#ccc;cursor:pointer;user-select:none}.chk input{width:18px;height:18px;accent-color:var(--primary)}
.sl{margin:12px 0}.sl label{font-size:13px;color:#ccc;margin-bottom:6px;display:flex;justify-content:space-between}.sl label span{color:var(--primary);font-weight:700}.sl input{width:100%}
.imgf{display:flex;gap:8px;margin-bottom:10px}.imgf .inp{margin:0;flex:1}
.item{display:flex;flex-direction:column;gap:2px;padding:12px;margin-bottom:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);position:relative}
.item .rm{position:absolute;top:8px;right:8px}
.sb{padding:10px 13px;border:0;border-radius:10px;background:rgba(255,255,255,.08);transition:.2s}.sb:hover{background:rgba(255,255,255,.15)}.sb.dn{background:rgba(239,68,68,.15)}.sb.dn:hover{background:rgba(239,68,68,.3)}
.pb{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--secondary));font-weight:800;transition:.2s}.pb:hover{filter:brightness(1.1)}.pb:disabled{opacity:.6}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.thumbs div{position:relative}.thumbs img{width:70px;height:42px;object-fit:cover;border-radius:6px;display:block}.thumbs button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#ef4444;color:#fff;font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.chip{padding:10px 6px;border-radius:10px;border:2px solid transparent;text-align:center;font-size:11px;font-weight:700;color:#fff;transition:.2s}.chip:hover{transform:translateY(-2px)}.chip.on{border-color:#fff;box-shadow:0 0 15px rgba(255,255,255,.4)}
#loading{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:#050509;transition:opacity .4s}#loading.hide{opacity:0;pointer-events:none}
.loader{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--primary);animation:spin .8s linear infinite}
#toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,30px);padding:12px 18px;border-radius:12px;background:#15151e;border:1px solid rgba(255,255,255,.1);opacity:0;pointer-events:none;transition:.3s;z-index:2000;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.error{border-color:rgba(239,68,68,.5)}#toast.success{border-color:rgba(34,197,94,.5)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media(max-width:650px){.grid2{grid-template-columns:1fr}.card{padding:22px}#cur,.trail{display:none}.friends{grid-template-columns:1fr}#mini{bottom:72px;right:12px;max-width:240px}.fb{width:44px;height:44px}.th img,.th .ni{width:64px;height:64px}}

<script>
/* =========================================================
   local-backend.js — substitui o servidor (sem servidor, sem conta)
   - "Salvar tudo" grava no IndexedDB do navegador (aguenta arquivos grandes)
   - Visitantes leem o arquivo profile.json que fica ao lado do index.html
   - Login do admin = senha local (definida no primeiro acesso)
   Coloque este código ANTES do script principal, no lugar das 4 tags do servidor.
========================================================= */
(() => {
const DBN = "pf_local", KEY = "profile";
const idb = () => new Promise((ok, no) => {
  const r = indexedDB.open(DBN, 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv");
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
});
const kv = async (mode, fn) => {
  const d = await idb();
  return new Promise((ok, no) => {
    const t = d.transaction("kv", mode), q = fn(t.objectStore("kv"));
    t.oncomplete = () => ok(q && q.result);
    t.onerror = t.onabort = () => no(t.error || new Error("Falha ao gravar no navegador (espaço cheio?)"));
  });
};
const getLocal = () => kv("readonly", s => s.get(KEY));
const setLocal = v => kv("readwrite", s => s.put(v, KEY));
const delLocal = () => kv("readwrite", s => s.delete(KEY));

/* 1º o que o admin salvou neste navegador; 2º o profile.json publicado; 3º vazio (padrões do site) */
async function load() {
  try { const l = await getLocal(); if (l) return l; } catch (e) {}
  try { const r = await fetch("profile.json", { cache: "no-store" }); if (r.ok) return await r.json(); } catch (e) {}
  return {};
}
const at = (o, p) => p.split("/").slice(1).reduce((a, k) => a && a[k], o);
const snap = v => ({ val: () => (v === undefined ? null : v) });
const database = () => ({ ref: path => ({
  once: async () => snap(at(await load(), path)),
  on: (ev, cb) => { load().then(d => cb(snap(at(d, path)))); },
  set: async v => { if (path !== "profile") throw new Error("Caminho não suportado"); await setLocal(JSON.parse(JSON.stringify(v))); }
}) });

/* login local */
let user = sessionStorage.getItem("pf_sess") ? { uid: "local-admin", email: "administrador (local)" } : null;
const cbs = [], emit = () => cbs.forEach(f => f(user));
const hash = async s => {
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("pf:" + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch (e) { return btoa(unescape(encodeURIComponent("pf:" + s))); }
};
const auth = {
  get currentUser() { return user; },
  async signInWithEmailAndPassword(e, p) {
    const h = await hash(p), saved = localStorage.getItem("pf_admin");
    if (!saved) {
      if (p.length < 4) throw new Error("Escolha uma senha com pelo menos 4 caracteres.");
      if (!confirm("Primeiro acesso: definir esta senha de administrador neste navegador?")) throw new Error("Cancelado.");
      localStorage.setItem("pf_admin", h);
    } else if (saved !== h) throw new Error("Senha incorreta.");
    user = { uid: "local-admin", email: e || "administrador (local)" };
    sessionStorage.setItem("pf_sess", "1"); emit(); return { user };
  },
  async signOut() { user = null; sessionStorage.removeItem("pf_sess"); emit(); },
  onAuthStateChanged(cb) { cbs.push(cb); setTimeout(() => cb(user), 0); }
};

/* "storage": guarda o arquivo como data URL dentro do perfil (imagens grandes são reduzidas) */
const readURL = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
const small = (src, max) => new Promise(ok => {
  const im = new Image();
  im.onload = () => {
    const r = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = im.width * r; c.height = im.height * r; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    ok(c.toDataURL("image/webp", .85));
  };
  im.onerror = () => ok(src); im.src = src;
});
const storage = () => ({ ref: () => ({ put: async f => {
  let u = await readURL(f);
  if (/^image\/(png|jpeg|webp)$/.test(f.type) && f.size > 400 * 1024) u = await small(u, 1400);
  return { ref: { getDownloadURL: async () => u } };
} }) });

window.LB = { auth, database, storage };

/* botões extras no painel admin: exportar / importar / descartar */
const save = document.getElementById("save");
if (save) {
  const box = document.createElement("div");
  box.className = "sec";
  box.innerHTML = `<h3>💾 Salvamento local</h3>
  <p class="fd" style="margin-bottom:12px">"Salvar tudo" guarda neste navegador. Para os visitantes verem as mudanças: baixe o <b>profile.json</b> e coloque na mesma pasta do index.html no seu site.</p>
  <div class="grid2"><button class="sb" id="lbExp" type="button">⬇️ Baixar profile.json</button><button class="sb" id="lbImp" type="button">⬆️ Importar profile.json</button></div>
  <input type="file" id="lbFile" accept="application/json,.json" hidden>
  <button class="sb dn" id="lbRst" type="button" style="width:100%;margin-top:10px">Descartar alterações deste navegador</button>`;
  save.before(box);
  document.getElementById("lbExp").onclick = async () => {
    const data = (typeof P !== "undefined" && P) ? P : await load();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
    a.download = "profile.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  document.getElementById("lbImp").onclick = () => document.getElementById("lbFile").click();
  document.getElementById("lbFile").onchange = async e => {
    try { const f = e.target.files[0]; if (!f) return; await setLocal(JSON.parse(await f.text())); location.reload(); }
    catch (err) { alert("Arquivo inválido: " + err.message); }
  };
  document.getElementById("lbRst").onclick = async () => {
    if (confirm("Descartar o que foi salvo neste navegador e voltar ao profile.json publicado?")) { await delLocal(); location.reload(); }
  };
}
/* texto do aviso antigo sobre servidor */
setTimeout(() => { const p = document.querySelector("#aBody .sec p.fd"); if (p) p.textContent = "Modo local: tudo é salvo neste navegador (IndexedDB), sem servidor. Use os botões de profile.json abaixo para publicar. A senha do painel é local e não substitui segurança de servidor."; }, 0);
})();
</script>
<script>
const auth=LB.auth,db=LB.database(),storage=LB.storage(),PATH="profile";

async function uploadMedia(file,folder="media"){

  const allowed=/^(image\/(png|jpeg|webp|gif)|audio\/(mpeg|mp3|wav|x-wav|ogg|mp4|aac|m4a|webm|x-m4a)|video\/(mp4|webm|ogg))$/i;

const LIVE0=()=>({enabled:true,emoji:"💻",text:"Atualmente desenvolvendo um projeto",useDiscord:false,discordId:""});
const SEC0=()=>({enabled:true,word:"segredo",title:"🔓 Área secreta",content:"Você encontrou a página escondida! Obrigado por explorar.",image:"",link:"",linkText:"Abrir"});
const EGG0=()=>({name:"Você clicou tanto no meu nome que ele ficou tímido 🙈",hole:"Ei! Isso é o furo do disco, não um botão 😅",dot:"Você achou o ponto secreto!",console:"👀 Curioso(a), hein? Procure por segredos na página..."});
const AMB0=()=>({enabled:true,type:"rain",volume:.15});
const ACH=[["hello","👋","Bem-vindo","Visitou o site"],["info","🪪","Curioso","Abriu a caixa de informações"],["music","🎵","DJ","Tocou uma música"],["explore","🧭","Explorador","Visitou Fóruns e Amigos"],["modes","🌗","Duas faces","Trocou entre claro e escuro"],["ambient","🎧","Zen","Ligou a música ambiente"],["secret","🕵️","Hacker","Desbloqueou a página secreta"],["egg","🥚","Caçador de ovos","Achou um easter egg"],["eggs","🐣","Mestre dos ovos","Achou todos os easter eggs"],["lost","👻","Perdido","Encontrou a página 404"],["night","🦉","Coruja","Visitou de madrugada"]];

/* conquistas */
function unlock(id){
  if(P?.ach?.enabled===false)return;const got=jget("ach",[]);if(got.includes(id))return;got.push(id);ls.set("ach",JSON.stringify(got));
  const a=ACH.find(x=>x[0]===id);toast(`🏆 Conquista: ${a[1]} ${a[2]}`,"success");
}
function renderAch(){
  const got=jget("ach",[]);$("achN").textContent=`${got.length}/${ACH.length}`;
  $("achL").innerHTML=ACH.map(([id,i,n,d])=>{const g=got.includes(id);return`<div class="if" style="opacity:${g?1:.45}"><span>${g?i:"🔒"} <b style="color:var(--text)">${g?n:"???"}</b></span><span style="text-align:right">${g?d:"Continue explorando"}</span></div>`}).join("");
}
$("bAch").onclick=()=>{renderAch();openM("mAch")};
function seen(p){const s=new Set(jget("seen",[]));s.add(p);ls.set("seen",JSON.stringify([...s]));if(s.has("forum")&&s.has("friends"))unlock("explore")}

/* modo claro / escuro */
function setMode(m,silent){document.body.classList.toggle("light",m==="light");$("bMode").textContent=m==="light"?"🌙":"☀️";if(!silent){ls.set("mode",m);unlock("modes")}}
$("bMode").onclick=()=>setMode(document.body.classList.contains("light")?"dark":"light");

/* música ambiente (gerada no navegador, sem arquivos) */
let amb=null,ambTried=false;
function ambStart(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC||amb)return;const c=new AC(),g=c.createGain(),t=P.ambient.type;g.gain.value=0;g.connect(c.destination);
  if(t==="pad")[130.81,196,246.94,329.63].forEach((f,i)=>{const o=c.createOscillator(),og=c.createGain(),l=c.createOscillator(),lg=c.createGain();o.frequency.value=f;og.gain.value=.12;l.frequency.value=.07+i*.03;lg.gain.value=.08;l.connect(lg);lg.connect(og.gain);o.connect(og);og.connect(g);o.start();l.start()});
  else{const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=t==="rain"?l*2.2:l*2.5}
    const s=c.createBufferSource(),f=c.createBiquadFilter();s.buffer=b;s.loop=true;f.type="lowpass";f.frequency.value=t==="rain"?850:500;s.connect(f);f.connect(g);s.start()}
  g.gain.linearRampToValueAtTime(Math.min(.12,Number(P.ambient.volume||.15)*.22),c.currentTime+3);amb={c,g};$("bAmb").classList.add("on");
}
function ambStop(){if(!amb)return;const{c,g}=amb;g.gain.linearRampToValueAtTime(0,c.currentTime+.8);setTimeout(()=>c.close(),900);amb=null;$("bAmb").classList.remove("on")}
$("bAmb").onclick=()=>{if(amb){ambStop();ls.set("amb","0")}else{ambStart();ls.set("amb","1");unlock("ambient")}};
document.addEventListener("pointerdown",()=>{if(!ambTried&&P&&ls.get("amb")==="1"&&P.ambient.enabled&&!amb){ambTried=true;ambStart()}},{passive:true});

/* status ao vivo */
function paintLive(){
  const l=P.live,el=$("live");if(!l.enabled){el.style.display="none";return}
  let t=`${l.emoji||""} ${l.text||""}`.trim(),s="online";const d=l.discordId&&friendCache[l.discordId]?.data;
  if(l.useDiscord&&d){s=d.discord_status;const a=d.activities?.find(x=>x.type!==4);if(a)t=`${["🎮 Jogando","📺 Transmitindo","🎵 Ouvindo","👁️ Assistindo","✨"][a.type]||"💬"} ${a.name||a.state||""}`}
  el.style.setProperty("--ld",{online:"#23a55a",idle:"#f0b232",dnd:"#f23f43",offline:"#80848e"}[s]||"#23a55a");
  $("liveT").textContent=t;el.style.display=t?"flex":"none";
}
const _rf=renderFriends;renderFriends=function(){_rf();paintLive()};

/* cursor customizado */
function applyCursor(){
  const s=P.cursorStyle||"ring";root.setProperty("--cs",(P.cursorSize||22)+"px");cur.className="s-"+s;
  cur.textContent=s==="emoji"?(P.cursorEmoji||"✨"):"";cur.style.backgroundImage=s==="image"&&P.cursorImg?`url("${P.cursorImg}")`:"";
}

/* segredo + easter eggs */
function paintSecret(){
  const s=P.secret,ok=s.enabled&&(ls.get("secret")||auth.currentUser);$("tabSecret").style.display=ok?"":"none";if(!ok&&page==="secret")switchPage("home");
  $("sTitle").textContent=s.title;$("sTxt").textContent=s.content;const i=$("sImg");i.style.display=s.image?"block":"none";if(s.image)i.src=s.image;
  const a=$("sLink");a.style.display=s.link?"block":"none";a.href=safeUrl(s.link)||"#";a.style.pointerEvents=safeUrl(s.link)?"auto":"none";a.textContent=s.linkText||"Abrir";
}
function openSecret(){if(!P.secret.enabled)return;ls.set("secret","1");paintSecret();switchPage("secret");unlock("secret");toast("🔓 Modo secreto desbloqueado!","success")}
const KON=["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];let kb=[],tb="";
document.addEventListener("keydown",e=>{
  if(!P||e.target.closest("input,textarea,select"))return;
  kb=[...kb,e.key.length>1?e.key:e.key.toLowerCase()].slice(-10);if(KON.every((k,i)=>kb[i]===k)){kb=[];openSecret()}
  const w=(P.secret.word||"").toLowerCase();if(w&&e.key.length===1){tb=(tb+e.key.toLowerCase()).slice(-w.length);if(tb===w){tb="";openSecret()}}
});
function egg(k){const f=jget("eggs",[]);if(!f.includes(k)){f.push(k);ls.set("eggs",JSON.stringify(f));unlock("egg");if(["name","hole","dot"].every(x=>f.includes(x)))unlock("eggs")}toast("🥚 "+(P.eggs[k]||"..."),"success")}
const clicks={};
function multi(el,key,n,fn){el.addEventListener("click",()=>{clicks[key]=(clicks[key]||0)+1;clearTimeout(clicks[key+"t"]);clicks[key+"t"]=setTimeout(()=>clicks[key]=0,900);if(clicks[key]>=n){clicks[key]=0;fn()}})}
multi($("name"),"n",5,()=>egg("name"));multi($("dot"),"d",7,()=>{egg("dot");openSecret()});
const hole=document.querySelector(".vhole");hole.addEventListener("click",e=>e.stopPropagation());multi(hole,"h",3,()=>egg("hole"));
$("a-achr").onclick=()=>{["ach","eggs","secret","seen"].forEach(k=>ls.set(k,""));paintSecret();toast("Progresso local limpo","info")};

/* 404 divertida (rotas por #hash desconhecidas) */
function route(){
  const h=location.hash.replace(/^#\/?/,"");if(!h)return;
  if(["home","forum","friends"].includes(h))switchPage(h);
  else if(h==="secret"&&ls.get("secret"))switchPage("secret");
  else{openM("mErr");unlock("lost")}
}
$("ghost").onclick=function(){this.classList.add("run");setTimeout(()=>this.classList.remove("run"),1500)};
$("errHome").onclick=()=>history.replaceState(null,"",location.pathname+location.search);

function paintExtras(){
  paintLive();paintSecret();$("bAmb").style.display=P.ambient.enabled?"":"none";$("bAch").style.display=P.ach.enabled===false?"none":"";
  if(!P.ambient.enabled&&amb)ambStop();
}
function postInit(){
  let m=ls.get("mode")||P.defaultMode;if(m==="auto")m=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";setMode(m,true);
  paintExtras();unlock("hello");if(new Date().getHours()<5)unlock("night");
  if(P.eggs.console)console.log("%c"+P.eggs.console,"color:#8b5cf6;font-size:14px;font-weight:bold");
  route();addEventListener("hashchange",route);
  db.ref(PATH+"/live").on("value",s=>{if(auth.currentUser||!s.val())return;P.live={...LIVE0(),...s.val()};paintLive();refreshFriends()});
}
const LIVEDEF=[["enabled","check","Mostrar status ao vivo"],["emoji","text","Emoji"],["text","text","Texto (ex: Atualmente desenvolvendo um projeto)"],["useDiscord","check","Mostrar a atividade do Discord quando houver"],["discordId","text","Seu Discord ID (via Lanyard)"]];
const SECDEF=[["enabled","check","Ativar modo secreto"],["word","text","Palavra secreta (digitada no teclado; o código Konami também funciona)"],["title","text","Título da página"],["content","area","Conteúdo"],["image","img","Imagem (opcional)",900],["link","text","Link (opcional)"],["linkText","text","Texto do link"]];
const EGGDEF=[["name","text","Ao clicar 5× no nome"],["hole","text","Ao clicar 3× no furo do disco"],["dot","text","Ao clicar 7× no ponto do rodapé (também abre o segredo no celular)"],["console","text","Mensagem no console do navegador"]];
const MODEDEF=[["defaultMode","select","Modo inicial do visitante",{dark:"Escuro",light:"Claro",auto:"Seguir o sistema"}]];
const AMBDEF=[["enabled","check","Mostrar botão de música ambiente"],["type","select","Som",{rain:"Chuva",wind:"Vento",pad:"Atmosfera (synth)"}],["volume","range","Volume",.05,1,.05,""]];
const CURDEF=[["cursorStyle","select","Estilo do cursor",{ring:"Anel",dot:"Ponto",emoji:"Emoji",image:"Imagem (PNG/GIF)"}],["cursorSize","range","Tamanho",14,64,2,"px"],["cursorEmoji","text","Emoji do cursor"],["cursorImg","img","Imagem do cursor",96]];

/* ================= INICIAR ================= */
async function init(){
  try{
    const v=(await db.ref(PATH).once("value")).val()||{};
    P={...DEF(),...v};P.ui={...UI0(),...(v.ui||{})};P.info={...INFO0(),...(v.info||{})};P.live={...LIVE0(),...(v.live||{})};P.secret={...SEC0(),...(v.secret||{})};P.eggs={...EGG0(),...(v.eggs||{})};P.ambient={...AMB0(),...(v.ambient||{})};P.ach={enabled:true,...(v.ach||{})};
    ["backgrounds","links","badges","playlist","forumCategories","forumThreads","friends"].forEach(k=>{if(!Array.isArray(P[k]))P[k]=P[k]&&typeof P[k]==="object"?Object.values(P[k]):[]});
    ["fields","stats"].forEach(k=>{if(!Array.isArray(P.info[k]))P.info[k]=[]});
    document.title=P.name;
    applyTheme();applyUI();renderMain();renderForum();renderFriends();startBg();initParticles();initCursor();
    $("shuf").classList.toggle("on",!!P.shuffle);$("rep").classList.toggle("on",P.loop!==false);vol=Number.isFinite(+P.musicVolume)?Math.max(0,Math.min(1,+P.musicVolume)):.30;$("vol").value=vol;au.volume=vol;
    load();refreshFriends();postInit();
  }catch(e){console.error(e);toast("Erro ao carregar o perfil.","error")}
  setTimeout(()=>$("loading").classList.add("hide"),400);
}
init();
</script>
