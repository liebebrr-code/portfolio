<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu Perfil</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {

            --primary: #8b5cf6;
            --secondary: #6366f1;

            --background: #08080b;

            --text: #ffffff;
            --muted: #a1a1aa;

            --card-opacity: .78;
            --blur: 18px;
            --radius: 24px;

        }

        html {
            scroll-behavior: smooth;
        }

        body {

            min-height: 100vh;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            color: var(--text);

            background:
                var(--background);

            overflow-x: hidden;

        }


        /* =====================================================
           FUNDO
        ===================================================== */

        #background {

            position: fixed;

            inset: 0;

            z-index: -10;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            background-size: cover;

            background-position: center;

            transition:
                background-image 1.2s ease,
                background-color 1.2s ease;

        }


        #background::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                rgba(0,0,0,.42);

        }


        /* =====================================================
           PARTÍCULAS
        ===================================================== */

        #particles {

            position: fixed;

            inset: 0;

            z-index: -5;

            pointer-events: none;

            overflow: hidden;

        }


        .particle {

            position: absolute;

            width: 4px;

            height: 4px;

            border-radius: 50%;

            background: white;

            opacity: .45;

            animation:
                particleFloat linear infinite;

        }


        @keyframes particleFloat {

            from {

                transform:
                    translateY(110vh);

            }

            to {

                transform:
                    translateY(-110vh);

            }

        }


        /* =====================================================
           TOPO
        ===================================================== */

        .topbar {

            width: min(1100px, 94%);

            margin:
                18px auto;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

        }


        .logo {

            font-size: 16px;

            font-weight: 900;

            letter-spacing: 4px;

        }


        .languages {

            display: flex;

            gap: 6px;

        }


        .languages button {

            border:
                1px solid
                rgba(255,255,255,.12);

            background:
                rgba(15,15,20,.75);

            color: white;

            padding:
                8px 11px;

            border-radius: 10px;

            cursor: pointer;

            backdrop-filter:
                blur(10px);

        }


        .languages button:hover {

            border-color:
                var(--primary);

        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {

            width:
                min(1000px,94%);

            margin:
                30px auto 60px;

        }


        /* =====================================================
           CARD
        ===================================================== */

        .profile-card {

            overflow: hidden;

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius:
                var(--radius);

            background:
                rgba(
                    18,
                    18,
                    23,
                    var(--card-opacity)
                );

            backdrop-filter:
                blur(var(--blur));

            -webkit-backdrop-filter:
                blur(var(--blur));

            box-shadow:
                0 30px 100px
                rgba(0,0,0,.5);

        }


        /* =====================================================
           BANNER
        ===================================================== */

        .banner {

            height: 250px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            background-size: cover;

            background-position: center;

            transition:
                1s ease;

        }


        /* =====================================================
           PROFILE
        ===================================================== */

        .profile-content {

            padding:
                0 40px 45px;

        }


        .avatar {

            width: 145px;

            height: 145px;

            margin-top:
                -72px;

            border-radius: 50%;

            object-fit: cover;

            background: #18181b;

            border:
                6px solid
                rgba(255,255,255,.15);

            box-shadow:
                0 15px 50px
                rgba(0,0,0,.6);

            transition:
                transform .3s ease;

        }


        .avatar:hover {

            transform:
                scale(1.05);

        }


        h1 {

            margin-top: 15px;

            font-size: 36px;

        }


        .verified {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: 22px;

            height: 22px;

            border-radius: 50%;

            background:
                var(--primary);

            font-size: 12px;

        }


        .username {

            color:
                var(--muted);

            margin-top: 4px;

        }


        .bio {

            margin-top: 18px;

            max-width: 700px;

            color:
                #e4e4e7;

            line-height: 1.7;

            white-space: pre-wrap;

        }


        /* =====================================================
           ESTATÍSTICAS
        ===================================================== */

        .stats {

            display: flex;

            flex-wrap: wrap;

            gap: 40px;

            margin:
                30px 0;

        }


        .stat {

            display: flex;

            flex-direction: column;

        }


        .stat strong {

            font-size: 22px;

        }


        .stat span {

            color:
                var(--muted);

            font-size: 13px;

            margin-top: 3px;

        }


        /* =====================================================
           LINKS
        ===================================================== */

        .links {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }


        .links a {

            padding:
                11px 15px;

            border-radius: 12px;

            color: white;

            text-decoration: none;

            background:
                rgba(255,255,255,.07);

            border:
                1px solid
                rgba(255,255,255,.1);

            transition:
                .25s ease;

        }


        .links a:hover {

            transform:
                translateY(-3px);

            border-color:
                var(--primary);

        }


        /* =====================================================
           SEÇÕES
        ===================================================== */

        .section {

            margin-top:
                40px;

        }


        .section-title {

            margin-bottom:
                15px;

            font-size: 21px;

        }


        /* =====================================================
           GALERIA
        ===================================================== */

        .gallery {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px,1fr)
                );

            gap: 12px;

        }


        .gallery img {

            width: 100%;

            height: 190px;

            object-fit: cover;

            border-radius: 15px;

            cursor: pointer;

            transition:
                transform .3s ease;

        }


        .gallery img:hover {

            transform:
                scale(1.025);

        }


        /* =====================================================
           ARQUIVOS
        ===================================================== */

        .files {

            display: grid;

            gap: 10px;

        }


        .file {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 15px;

            padding: 14px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.06);

        }


        .file a {

            color:
                #c4b5fd;

        }


        /* =====================================================
           MODAIS
        ===================================================== */

        .overlay {

            position: fixed;

            inset: 0;

            z-index: 1000;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,.82);

            backdrop-filter:
                blur(14px);

        }


        .hidden {

            display: none !important;

        }


        .modal {

            width:
                min(430px,100%);

            max-height:
                92vh;

            overflow-y:
                auto;

            padding: 28px;

            border-radius: 20px;

            border:
                1px solid
                rgba(255,255,255,.12);

            background:
                #18181b;

            box-shadow:
                0 30px 100px
                rgba(0,0,0,.8);

        }


        .editor {

            width:
                min(850px,100%);

        }


        .modal h2 {

            margin-bottom:
                20px;

        }


        .modal h3 {

            margin-top:
                25px;

            margin-bottom:
                12px;

        }


        .modal label {

            display: block;

            color:
                #d4d4d8;

            font-size: 13px;

            margin-top: 10px;

        }


        .modal input,
        .modal textarea,
        .modal select {

            width: 100%;

            padding: 11px;

            margin:
                6px 0 10px;

            border:
                1px solid
                rgba(255,255,255,.1);

            border-radius: 10px;

            background:
                #09090b;

            color: white;

            outline: none;

        }


        .modal textarea {

            min-height:
                100px;

            resize:
                vertical;

        }


        .modal input:focus,
        .modal textarea:focus,
        .modal select:focus {

            border-color:
                var(--primary);

        }


        .grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

        }


        .modal button {

            padding:
                10px 14px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255,255,255,.12);

            background:
                rgba(255,255,255,.07);

            color: white;

            cursor: pointer;

        }


        .modal button:hover {

            border-color:
                var(--primary);

        }


        .primary-button {

            background:
                var(--primary) !important;

            border-color:
                transparent !important;

        }


        .editor-header {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

        }


        .close-button {

            font-size: 22px;

        }


        .actions {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 25px;

        }


        .error {

            min-height: 20px;

            margin: 5px 0;

            color:
                #f87171;

        }


        .success {

            color:
                #4ade80;

        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media(max-width:600px) {

            .profile-content {

                padding:
                    0 20px 30px;

            }


            .banner {

                height: 180px;

            }


            .avatar {

                width: 110px;

                height: 110px;

                margin-top:
                    -55px;

            }


            h1 {

                font-size: 28px;

            }


            .grid {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     FUNDO
========================================================= -->

<div id="background"></div>

<div id="particles"></div>


<!-- =========================================================
     TOPO
========================================================= -->

<header class="topbar">

    <div class="logo">
        PROFILE
    </div>


    <div class="languages">

        <button
            onclick="setLanguage('pt-BR')"
        >
            🇧🇷 PT-BR
        </button>


        <button
            onclick="setLanguage('en-US')"
        >
            🇺🇸 EN
        </button>

    </div>

</header>


<!-- =========================================================
     PERFIL
========================================================= -->

<main class="container">

    <article class="profile-card">


        <div
            id="banner"
            class="banner"
        ></div>


        <div class="profile-content">


            <img
                id="avatar"
                class="avatar"
                alt="Avatar"
            >


            <h1>

                <span id="name">
                    Meu Nome
                </span>

                <span class="verified">
                    ✓
                </span>

            </h1>


            <div
                id="username"
                class="username"
            >
                @usuario
            </div>


            <p
                id="bio"
                class="bio"
            >
                Bem-vindo ao meu perfil!
            </p>


            <!-- ESTATÍSTICAS -->

            <div class="stats">


                <div class="stat">

                    <strong id="views">
                        0
                    </strong>

                    <span
                        data-i18n="views"
                    >
                        Visualizações
                    </span>

                </div>


                <div class="stat">

                    <strong id="posts">
                        0
                    </strong>

                    <span
                        data-i18n="posts"
                    >
                        Posts
                    </span>

                </div>


                <div class="stat">

                    <strong id="followers">
                        0
                    </strong>

                    <span
                        data-i18n="followers"
                    >
                        Seguidores
                    </span>

                </div>


            </div>


            <!-- LINKS -->

            <div
                id="links"
                class="links"
            ></div>


            <!-- GALERIA -->

            <section class="section">

                <h2
                    class="section-title"
                    data-i18n="gallery"
                >
                    🖼️ Galeria
                </h2>

                <div
                    id="gallery"
                    class="gallery"
                ></div>

            </section>


            <!-- ARQUIVOS -->

            <section class="section">

                <h2
                    class="section-title"
                    data-i18n="files"
                >
                    📎 Arquivos
                </h2>

                <div
                    id="files"
                    class="files"
                ></div>

            </section>


        </div>

    </article>

</main>


<!-- =========================================================
     LOGIN
========================================================= -->

<div
    id="loginModal"
    class="overlay hidden"
>


    <form
        class="modal"
        onsubmit="login(event)"
    >

        <h2
            data-i18n="privateArea"
        >
            🔐 Área privada
        </h2>


        <p
            data-i18n="passwordText"
        >
            Entre com sua conta para editar.
        </p>


        <label>
            E-mail
        </label>


        <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            required
        >


        <label>
            Senha
        </label>


        <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
        >


        <div
            id="loginError"
            class="error"
        ></div>


        <button
            class="primary-button"
            type="submit"
            data-i18n="enter"
        >
            Entrar
        </button>


    </form>

</div>


<!-- =========================================================
     EDITOR
========================================================= -->

<div
    id="editorModal"
    class="overlay hidden"
>


    <div class="modal editor">


        <div class="editor-header">

            <h2
                data-i18n="editor"
            >
                🎨 Editor completo
            </h2>


            <button
                class="close-button"
                onclick="closeEditor()"
            >
                ×
            </button>

        </div>


        <!-- PERFIL -->

        <h3
            data-i18n="profile"
        >
            👤 Perfil
        </h3>


        <label
            data-i18n="name"
        >
            Nome
        </label>


        <input
            id="editName"
        >


        <label
            data-i18n="username"
        >
            Username
        </label>


        <input
            id="editUsername"
        >


        <label
            data-i18n="bio"
        >
            Biografia
        </label>


        <textarea
            id="editBio"
        ></textarea>


        <!-- CORES -->

        <div class="grid">


            <div>

                <label>
                    Cor principal
                </label>

                <input
                    id="editPrimary"
                    type="color"
                >

            </div>


            <div>

                <label>
                    Cor secundária
                </label>

                <input
                    id="editSecondary"
                    type="color"
                >

            </div>


        </div>


        <!-- AVATAR -->

        <h3>
            🖼️ Avatar
        </h3>


        <input
            id="avatarInput"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif"
        >


        <!-- FUNDOS -->

        <h3
            data-i18n="background"
        >
            🌄 Fundo
        </h3>


        <label>
            Adicionar fundos
        </label>


        <input
            id="backgroundInput"
            type="file"
            multiple
            accept="image/png,image/jpeg,image/webp,image/gif"
        >


        <label
            data-i18n="backgroundTime"
        >
            Tempo de troca
        </label>


        <select
            id="backgroundTime"
        >

            <option value="3000">
                3 segundos
            </option>

            <option value="5000">
                5 segundos
            </option>

            <option value="8000">
                8 segundos
            </option>

            <option value="15000">
                15 segundos
            </option>

        </select>


        <label>
            Fundo quando não houver imagem
        </label>


        <select
            id="backgroundMode"
        >

            <option value="gradient">
                Gradiente
            </option>

            <option value="solid">
                Cor sólida
            </option>

        </select>


        <!-- APARÊNCIA -->

        <h3
            data-i18n="appearance"
        >
            ✨ Aparência
        </h3>


        <label>
            Transparência
        </label>


        <input
            id="cardOpacity"
            type="range"
            min=".2"
            max="1"
            step=".05"
        >


        <label>
            Blur
        </label>


        <input
            id="cardBlur"
            type="range"
            min="0"
            max="40"
        >


        <label>
            Arredondamento
        </label>


        <input
            id="cardRadius"
            type="range"
            min="0"
            max="50"
        >


        <label>

            <input
                id="particlesToggle"
                type="checkbox"
            >

            <span
                data-i18n="particles"
            >
                Partículas
            </span>

        </label>


        <!-- ESTATÍSTICAS -->

        <h3
            data-i18n="statistics"
        >
            📊 Estatísticas
        </h3>


        <div class="grid">


            <div>

                <label>
                    Posts
                </label>

                <input
                    id="editPosts"
                    type="number"
                    min="0"
                >

            </div>


            <div>

                <label>
                    Seguidores
                </label>

                <input
                    id="editFollowers"
                    type="number"
                    min="0"
                >

            </div>


        </div>


        <!-- LINKS -->

        <h3
            data-i18n="links"
        >
            🔗 Links
        </h3>


        <input
            id="discordLink"
            placeholder="Discord"
        >


        <input
            id="youtubeLink"
            placeholder="YouTube"
        >


        <input
            id="githubLink"
            placeholder="GitHub"
        >


        <!-- GALERIA -->

        <h3
            data-i18n="gallery"
        >
            🖼️ Galeria
        </h3>


        <input
            id="galleryInput"
            type="file"
            multiple
            accept="image/png,image/jpeg,image/webp,image/gif"
        >


        <!-- ARQUIVOS -->

        <h3
            data-i18n="files"
        >
            📎 Arquivos
        </h3>


        <input
            id="filesInput"
            type="file"
            multiple
        >


        <!-- AÇÕES -->

        <div class="actions">


            <button
                class="primary-button"
                onclick="saveProfile()"
                data-i18n="save"
            >
                💾 Salvar tudo
            </button>


            <button
                onclick="resetProfile()"
            >
                🔄 Restaurar
            </button>


            <button
                onclick="logout()"
            >
                🚪 Sair
            </button>


            <button
                onclick="closeEditor()"
                data-i18n="close"
            >
                Fechar
            </button>


        </div>


        <div
            id="saveMessage"
            class="success"
        ></div>


    </div>

</div>

     SISTEMA DO SITE
========================================================= -->

<script>


    /* =====================================================
       IDIOMAS
    ===================================================== */


    const translations = {


        "pt-BR": {

            views:
                "Visualizações",

            posts:
                "Posts",

            followers:
                "Seguidores",

            gallery:
                "🖼️ Galeria",

            files:
                "📎 Arquivos",

            privateArea:
                "🔐 Área privada",

            passwordText:
                "Entre com sua conta para editar.",

            enter:
                "Entrar",

            editor:
                "🎨 Editor completo",

            profile:
                "👤 Perfil",

            background:
                "🌄 Fundo",

            appearance:
                "✨ Aparência",

            statistics:
                "📊 Estatísticas",

            links:
                "🔗 Links",

            save:
                "💾 Salvar tudo",

            close:
                "Fechar",

            particles:
                "Partículas"

        },


        "en-US": {

            views:
                "Views",

            posts:
                "Posts",

            followers:
                "Followers",

            gallery:
                "🖼️ Gallery",

            files:
                "📎 Files",

            privateArea:
                "🔐 Private Area",

            passwordText:
                "Sign in to edit your profile.",

            enter:
                "Sign in",

            editor:
                "🎨 Full Editor",

            profile:
                "👤 Profile",

            background:
                "🌄 Background",

            appearance:
                "✨ Appearance",

            statistics:
                "📊 Statistics",

            links:
                "🔗 Links",

            save:
                "💾 Save everything",

            close:
                "Close",

            particles:
                "Particles"

        }

    };


    let currentLanguage =
        localStorage.getItem(
            "profileLanguage"
        );


    if (!currentLanguage) {

        currentLanguage =
            navigator.language
                ?.toLowerCase()
                .startsWith("en")
                ? "en-US"
                : "pt-BR";

    }


    function setLanguage(
        language
    ) {

        currentLanguage =
            language;

        localStorage.setItem(
            "profileLanguage",
            language
        );


        document.documentElement.lang =
            language;


        document
            .querySelectorAll(
                "[data-i18n]"
            )
            .forEach(
                element => {

                    const key =
                        element.dataset.i18n;

                    if (
                        translations[
                            language
                        ][key]
                    ) {

                        element.textContent =
                            translations[
                                language
                            ][key];

                    }

                }
            );


        renderProfile();

    }


    /* =====================================================
       CONFIGURAÇÃO PADRÃO
    ===================================================== */


    const defaultProfile = {


        name:
            "Meu Nome",

        username:
            "@usuario",

        bio:
            "Bem-vindo ao meu perfil! 👋",

        avatar:
            "",

        primary:
            "#8b5cf6",

        secondary:
            "#6366f1",

        backgrounds:
            [],

        backgroundTime:
            5000,

        backgroundMode:
            "gradient",

        opacity:
            .78,

        blur:
            18,

        radius:
            24,

        particles:
            true,

        posts:
            0,

        followers:
            0,

        views:
            0,

        links:
            [],

        gallery:
            [],

        files:
            []

    };


    let profile =
        JSON.parse(
            localStorage.getItem(
                "myProfile"
            )
        ) ||
        defaultProfile;


    let backgroundInterval;


    /* =====================================================
       SALVAR
    ===================================================== */


    function saveLocal() {

        localStorage.setItem(
            "myProfile",
            JSON.stringify(
                profile
            )
        );

    }


    /* =====================================================
       HTML SEGURO
    ===================================================== */


    function escapeHTML(
        text
    ) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            text;

        return div.innerHTML;

    }


    /* =====================================================
       RENDER
    ===================================================== */


    function renderProfile() {


        document.documentElement
            .style
            .setProperty(
                "--primary",
                profile.primary
            );


        document.documentElement
            .style
            .setProperty(
                "--secondary",
                profile.secondary
            );


        document.documentElement
            .style
            .setProperty(
                "--card-opacity",
                profile.opacity
            );


        document.documentElement
            .style
            .setProperty(
                "--blur",
                profile.blur + "px"
            );


        document.documentElement
            .style
            .setProperty(
                "--radius",
                profile.radius + "px"
            );


        document.getElementById(
            "name"
        ).textContent =
            profile.name;


        document.getElementById(
            "username"
        ).textContent =
            profile.username;


        document.getElementById(
            "bio"
        ).textContent =
            profile.bio;


        document.getElementById(
            "posts"
        ).textContent =
            profile.posts
                .toLocaleString(
                    currentLanguage
                );


        document.getElementById(
            "followers"
        ).textContent =
            profile.followers
                .toLocaleString(
                    currentLanguage
                );


        document.getElementById(
            "views"
        ).textContent =
            profile.views
                .toLocaleString(
                    currentLanguage
                );


        const avatar =
            document.getElementById(
                "avatar"
            );


        if (
            profile.avatar
        ) {

            avatar.src =
                profile.avatar;

        } else {

            avatar.src =
                "https://placehold.co/300x300/18181b/ffffff?text=PROFILE";

        }


        renderLinks();

        renderGallery();

        renderFiles();

        applyBackground();

        renderParticles();

    }


    /* =====================================================
       LINKS
    ===================================================== */


    function renderLinks() {


        const container =
            document.getElementById(
                "links"
            );


        container.innerHTML =
            "";


        profile.links
            .forEach(
                link => {

                    const a =
                        document.createElement(
                            "a"
                        );


                    a.href =
                        link.url;


                    a.target =
                        "_blank";


                    a.rel =
                        "noopener noreferrer";


                    a.textContent =
                        link.label;


                    container.appendChild(
                        a
                    );

                }
            );

    }


    /* =====================================================
       GALERIA
    ===================================================== */


    function renderGallery() {


        const container =
            document.getElementById(
                "gallery"
            );


        container.innerHTML =
            "";


        profile.gallery
            .forEach(
                image => {

                    const img =
                        document.createElement(
                            "img"
                        );


                    img.src =
                        image;


                    img.loading =
                        "lazy";


                    img.alt =
                        "Imagem da galeria";


                    container.appendChild(
                        img
                    );

                }
            );

    }


    /* =====================================================
       ARQUIVOS
    ===================================================== */


    function renderFiles() {


        const container =
            document.getElementById(
                "files"
            );


        container.innerHTML =
            "";


        profile.files
            .forEach(
                file => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "file";


                    const name =
                        document.createElement(
                            "span"
                        );


                    name.textContent =
                        "📎 " +
                        file.name;


                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        file.data;


                    link.download =
                        file.name;


                    link.textContent =
                        currentLanguage ===
                        "en-US"
                        ? "Open"
                        : "Abrir";


                    div.appendChild(
                        name
                    );


                    div.appendChild(
                        link
                    );


                    container.appendChild(
                        div
                    );

                }
            );

    }


    /* =====================================================
       FUNDO
    ===================================================== */


    function applyBackground() {


        clearInterval(
            backgroundInterval
        );


        const background =
            document.getElementById(
                "background"
            );


        const banner =
            document.getElementById(
                "banner"
            );


        if (
            profile.backgrounds.length
        ) {


            let index = 0;


            function changeBackground() {


                const image =
                    profile.backgrounds[
                        index
                    ];


                background.style.backgroundImage =
                    `url("${image}")`;


                banner.style.backgroundImage =
                    `url("${image}")`;


                index =
                    (
                        index + 1
                    ) %
                    profile.backgrounds.length;

            }


            changeBackground();


            if (
                profile.backgrounds
                    .length > 1
            ) {

                backgroundInterval =
                    setInterval(
                        changeBackground,
                        profile.backgroundTime
                    );

            }


        } else {


            if (
                profile.backgroundMode ===
                "solid"
            ) {

                background.style.backgroundImage =
                    "none";

                background.style.backgroundColor =
                    profile.primary;

                banner.style.backgroundImage =
                    "none";

                banner.style.backgroundColor =
                    profile.primary;

            } else {

                const gradient =
                    `linear-gradient(
                        135deg,
                        ${profile.primary},
                        ${profile.secondary}
                    )`;


                background.style.backgroundImage =
                    gradient;


                banner.style.backgroundImage =
                    gradient;

            }

        }

    }


    /* =====================================================
       PARTÍCULAS
    ===================================================== */


    function renderParticles() {


        const container =
            document.getElementById(
                "particles"
            );


        container.innerHTML =
            "";


        if (
            !profile.particles
        ) {

            return;

        }


        for (
            let i = 0;
            i < 45;
            i++
        ) {


            const particle =
                document.createElement(
                    "div"
                );


            particle.className =
                "particle";


            particle.style.left =
                Math.random() *
                100 +
                "%";


            particle.style.animationDuration =
                8 +
                Math.random() *
                18 +
                "s";


            particle.style.animationDelay =
                -Math.random() *
                20 +
                "s";


            container.appendChild(
                particle
            );

        }

    }


    /* =====================================================
       VISUALIZAÇÕES
    ===================================================== */


    function registerView() {


        const viewed =
            sessionStorage.getItem(
                "profileViewed"
            );


        if (
            viewed
        ) {

            return;

        }


        profile.views++;


        sessionStorage.setItem(
            "profileViewed",
            "true"
        );


        saveLocal();

    }


    /* =====================================================
       LOGIN
    ===================================================== */


    function openLogin() {

        document
            .getElementById(
                "loginModal"
            )
            .classList.remove(
                "hidden"
            );


        document
            .getElementById(
                "loginEmail"
            )
            .focus();

    }


    function closeLogin() {

        document
            .getElementById(
                "loginModal"
            )
            .classList.add(
                "hidden"
            );

    }


    async function login(
        event
    ) {


        event.preventDefault();


        const email =
            document.getElementById(
                "loginEmail"
            ).value;


        const password =
            document.getElementById(
                "loginPassword"
            ).value;


        const error =
            document.getElementById(
                "loginError"
            );


        error.textContent =
            "";


        try {


            await window.firebaseLogin(
                email,
                password
            );


            closeLogin();

            openEditor();


        } catch (
            firebaseError
        ) {


            console.error(
                firebaseError
            );


            error.textContent =
                "E-mail ou senha incorretos.";

        }

    }


    /* =====================================================
       EDITOR
    ===================================================== */


    function openEditor() {


        if (
            !window.firebaseUser
        ) {

            openLogin();

            return;

        }


        document
            .getElementById(
                "editorModal"
            )
            .classList.remove(
                "hidden"
            );


        loadEditor();

    }


    function closeEditor() {

        document
            .getElementById(
                "editorModal"
            )
            .classList.add(
                "hidden"
            );

    }


    function loadEditor() {


        document.getElementById(
            "editName"
        ).value =
            profile.name;


        document.getElementById(
            "editUsername"
        ).value =
            profile.username;


        document.getElementById(
            "editBio"
        ).value =
            profile.bio;


        document.getElementById(
            "editPrimary"
        ).value =
            profile.primary;


        document.getElementById(
            "editSecondary"
        ).value =
            profile.secondary;


        document.getElementById(
            "backgroundTime"
        ).value =
            profile.backgroundTime;


        document.getElementById(
            "backgroundMode"
        ).value =
            profile.backgroundMode;


        document.getElementById(
            "cardOpacity"
        ).value =
            profile.opacity;


        document.getElementById(
            "cardBlur"
        ).value =
            profile.blur;


        document.getElementById(
            "cardRadius"
        ).value =
            profile.radius;


        document.getElementById(
            "particlesToggle"
        ).checked =
            profile.particles;


        document.getElementById(
            "editPosts"
        ).value =
            profile.posts;


        document.getElementById(
            "editFollowers"
        ).value =
            profile.followers;


        document.getElementById(
            "discordLink"
        ).value =
            getLink(
                "Discord"
            );


        document.getElementById(
            "youtubeLink"
        ).value =
            getLink(
                "YouTube"
            );


        document.getElementById(
            "githubLink"
        ).value =
            getLink(
                "GitHub"
            );

    }


    function getLink(
        label
    ) {

        const found =
            profile.links.find(
                link =>
                    link.label
                        .toLowerCase()
                        .includes(
                            label.toLowerCase()
                        )
            );


        return found
            ? found.url
            : "";

    }


    /* =====================================================
       SALVAR PERFIL
    ===================================================== */


    async function saveProfile() {


        if (
            !window.firebaseUser
        ) {

            openLogin();

            return;

        }


        profile.name =
            document.getElementById(
                "editName"
            ).value;


        profile.username =
            document.getElementById(
                "editUsername"
            ).value;


        profile.bio =
            document.getElementById(
                "editBio"
            ).value;


        profile.primary =
            document.getElementById(
                "editPrimary"
            ).value;


        profile.secondary =
            document.getElementById(
                "editSecondary"
            ).value;


        profile.backgroundTime =
            Number(
                document.getElementById(
                    "backgroundTime"
                ).value
            );


        profile.backgroundMode =
            document.getElementById(
                "backgroundMode"
            ).value;


        profile.opacity =
            Number(
                document.getElementById(
                    "cardOpacity"
                ).value
            );


        profile.blur =
            Number(
                document.getElementById(
                    "cardBlur"
                ).value
            );


        profile.radius =
            Number(
                document.getElementById(
                    "cardRadius"
                ).value
            );


        profile.particles =
            document.getElementById(
                "particlesToggle"
            ).checked;


        profile.posts =
            Number(
                document.getElementById(
                    "editPosts"
                ).value
            );


        profile.followers =
            Number(
                document.getElementById(
                    "editFollowers"
                ).value
            );


        /* LINKS */


        profile.links = [];


        const links = [

            [
                "💬 Discord",
                "discordLink"
            ],

            [
                "▶️ YouTube",
                "youtubeLink"
            ],

            [
                "💻 GitHub",
                "githubLink"
            ]

        ];


        links.forEach(
            ([label,id]) => {


                const url =
                    document.getElementById(
                        id
                    ).value.trim();


                if (
                    url
                ) {

                    profile.links.push({

                        label:
                            label,

                        url:
                            url

                    });

                }

            }
        );


        /* AVATAR */


        const avatarFile =
            document.getElementById(
                "avatarInput"
            ).files[0];


        if (
            avatarFile
        ) {

            profile.avatar =
                await fileToDataURL(
                    avatarFile
                );

        }


        /* FUNDOS */


        const backgroundFiles =
            document.getElementById(
                "backgroundInput"
            ).files;


        for (
            const file
            of backgroundFiles
        ) {

            profile.backgrounds.push(
                await fileToDataURL(
                    file
                )
            );

        }


        /* GALERIA */


        const galleryFiles =
            document.getElementById(
                "galleryInput"
            ).files;


        for (
            const file
            of galleryFiles
        ) {

            profile.gallery.push(
                await fileToDataURL(
                    file
                )
            );

        }


        /* ARQUIVOS */


        const files =
            document.getElementById(
                "filesInput"
            ).files;


        for (
            const file
            of files
        ) {

            profile.files.push({

                name:
                    file.name,

                data:
                    await fileToDataURL(
                        file
                    )

            });

        }


        saveLocal();

        renderProfile();


        document.getElementById(
            "saveMessage"
        ).textContent =
            currentLanguage ===
            "en-US"
            ? "Saved successfully!"
            : "Salvo com sucesso!";


        setTimeout(
            () => {

                document.getElementById(
                    "saveMessage"
                ).textContent =
                    "";

            },
            2500
        );

    }


    /* =====================================================
       FILE → DATA URL
    ===================================================== */


    function fileToDataURL(
        file
    ) {

        return new Promise(
            (
                resolve,
                reject
            ) => {


                const reader =
                    new FileReader();


                reader.onload =
                    () =>
                        resolve(
                            reader.result
                        );


                reader.onerror =
                    reject;


                reader.readAsDataURL(
                    file
                );

            }
        );

    }


    /* =====================================================
       RESTAURAR
    ===================================================== */


    function resetProfile() {


        if (
            !confirm(
                currentLanguage ===
                "en-US"
                ? "Reset the profile?"
                : "Restaurar o perfil?"
            )
        ) {

            return;

        }


        profile =
            JSON.parse(
                JSON.stringify(
                    defaultProfile
                )
            );


        saveLocal();

        renderProfile();

        loadEditor();

    }


    /* =====================================================
       LOGOUT
    ===================================================== */


    async function logout() {


        await window.firebaseLogout();


        closeEditor();

    }


    /* =====================================================
       ATALHO SECRETO
    ===================================================== */


    document.addEventListener(
        "keydown",
        event => {


            if (

                event.ctrlKey &&

                event.shiftKey &&

                event.key
                    .toLowerCase() ===
                    "e"

            ) {


                event.preventDefault();


                if (
                    window.firebaseUser
                ) {

                    openEditor();

                } else {

                    openLogin();

                }

            }

        }
    );


    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */


    setLanguage(
        currentLanguage
    );


    registerView();


    renderProfile();


</script>


</body>

</html>
