<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil.me - Criador Ultra</title>

<style>
/* ... (mantenho todo o CSS original, apenas adiciono melhorias) ... */

/* Melhorias adicionais */
.modal input[type="file"] {
    padding: 8px;
    background: #181820;
    border: 1px dashed rgba(255,255,255,.2);
    cursor: pointer;
}

.modal input[type="file"]:hover {
    border-color: var(--primary);
}

.remove-file-btn {
    background: rgba(239,68,68,.2);
    border: none;
    color: #fca5a5;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    margin-left: 6px;
}

.remove-file-btn:hover {
    background: rgba(239,68,68,.3);
}

.empty-gallery, .empty-files, .empty-music {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
}

/* Melhorias mobile */
@media (max-width: 640px) {
    .modal .row {
        grid-template-columns: 1fr;
    }
    
    .modal .row-3 {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>
<!-- ... (mantenho todo o HTML original) ... -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getDatabase, ref, push, set, get, remove, runTransaction, update } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

/* =========================================================
   FIREBASE CONFIG
========================================================= */
const firebaseConfig = {
    apiKey: "AIzaSyB35ktkxiS_MPTrSflfHhBe5snYAV0iV6Q",
    authDomain: "myprofile-7db79.firebaseapp.com",
    databaseURL: "https://myprofile-7db79-default-rtdb.firebaseio.com",
    projectId: "myprofile-7db79",
    storageBucket: "myprofile-7db79.firebasestorage.app",
    messagingSenderId: "947862565874",
    appId: "1:947862565874:web:3116335ff6f1822f0df16b8",
    measurementId: "G-KC2ZXS400D"
};

/* =========================================================
   INIT
========================================================= */
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const profilesRef = ref(db, "profiles");

window.profiles = [];
window.currentUser = null;
window._profilesData = [];
window._editingId = null;
window._editingData = null;
window._viewingProfileId = null;
window._viewingProfile = null;

/* =========================================================
   AUTH STATE
========================================================= */
onAuthStateChanged(auth, user => {
    window.currentUser = user || null;
    updateAuthUI();
    loadProfiles();
});

/* =========================================================
   AUTH UI
========================================================= */
function updateAuthUI() {
    const area = document.getElementById("userArea");
    if (!area) return;

    if (window.currentUser) {
        const email = escapeHTML(window.currentUser.email || "");
        area.innerHTML = `
            <span class="user-email">👤 ${email}</span>
            <button class="btn btn-outline" onclick="logout()">🚪 Sair</button>
        `;
    } else {
        area.innerHTML = `
            <button class="btn btn-outline" onclick="openAuth()" id="loginButton">🔐 Entrar</button>
        `;
    }
}

/* =========================================================
   AUTH MODAL
========================================================= */
window.authMode = "login";

window.openAuth = function(mode = "login") {
    window.authMode = mode;
    document.getElementById("authModal").classList.add("active");
    switchAuth(mode);
};

window.closeAuth = function() {
    document.getElementById("authModal").classList.remove("active");
    document.getElementById("authError").style.display = "none";
};

window.switchAuth = function(mode) {
    window.authMode = mode;
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const submit = document.getElementById("authSubmit");
    
    loginTab.classList.toggle("active", mode === "login");
    registerTab.classList.toggle("active", mode === "register");
    submit.textContent = mode === "login" ? "🔐 Entrar" : "✨ Criar conta";
    document.getElementById("authError").style.display = "none";
};

window.submitAuth = async function() {
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;
    const error = document.getElementById("authError");

    if (!email) {
        error.textContent = "Digite seu e-mail.";
        error.style.display = "block";
        return;
    }

    if (password.length < 6) {
        error.textContent = "A senha precisa ter pelo menos 6 caracteres.";
        error.style.display = "block";
        return;
    }

    try {
        if (window.authMode === "login") {
            await signInWithEmailAndPassword(auth, email, password);
            showToast("✅", "Login realizado!");
        } else {
            await createUserWithEmailAndPassword(auth, email, password);
            showToast("🎉", "Conta criada!");
        }
        closeAuth();
        document.getElementById("authPassword").value = "";
    } catch (errorObj) {
        console.error(errorObj);
        let message = "Não foi possível realizar a operação.";
        
        switch (errorObj.code) {
            case "auth/invalid-email":
                message = "E-mail inválido.";
                break;
            case "auth/user-not-found":
                message = "Usuário não encontrado.";
                break;
            case "auth/wrong-password":
            case "auth/invalid-credential":
                message = "E-mail ou senha incorretos.";
                break;
            case "auth/email-already-in-use":
                message = "Esse e-mail já está cadastrado.";
                break;
            case "auth/weak-password":
                message = "A senha é muito fraca.";
                break;
            case "auth/too-many-requests":
                message = "Muitas tentativas. Aguarde um pouco.";
                break;
            default:
                message = errorObj.message || message;
        }

        error.textContent = message;
        error.style.display = "block";
    }
};

window.logout = async function() {
    try {
        await signOut(auth);
        showToast("👋", "Você saiu da conta.");
    } catch (e) {
        console.error(e);
    }
};

/* =========================================================
   CREATOR - MELHORADO
========================================================= */
window.openCreator = function(data = null) {
    if (!window.currentUser) {
        showToast("🔐", "Faça login para criar ou editar um perfil.");
        openAuth("login");
        return;
    }

    const modal = document.getElementById("creatorModal");
    modal.classList.add("active");

    const isEditing = !!data;
    document.getElementById("modalTitle").textContent = isEditing ? "✏️ Editar Perfil Ultra" : "✨ Criar Perfil Ultra";
    document.getElementById("modalSub").textContent = isEditing ? "Atualize todas as opções do seu perfil." : "Mais de 50 opções de personalização.";

    // Limpar todos os campos
    clearFormFields();

    // Preencher com dados se estiver editando
    if (data) {
        fillFormWithData(data);
    } else {
        setDefaultValues();
    }

    window._editingId = data?.id || null;
    window._editingData = data || null;
    window._removedFiles = {
        gallery: [],
        files: [],
        music: []
    };

    updateRangeLabels();
    document.getElementById("saveStatus").textContent = "";
    document.querySelector("#creatorModal .modal").scrollTop = 0;
};

function clearFormFields() {
    const fields = [
        'editName', 'editUsername', 'editBio', 'editLocation', 'editBirthday',
        'editGender', 'editPrimary', 'editSecondary', 'editTextColor', 'editBgColor',
        'editOpacity', 'editBlur', 'editRadius', 'editPadding', 'editFont',
        'editFontSize', 'editDiscord', 'editYoutube', 'editGithub', 'editTwitter',
        'editInstagram', 'editTiktok', 'editLinkedin', 'editTwitch', 'editSpotify',
        'editWebsite', 'editBgPosition', 'editBgSize', 'editVolume', 'editAutoplay'
    ];
    
    fields.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
    });

    const checkboxes = [
        'editBold', 'editItalic', 'editUppercase', 'editGlow', 'editParticles',
        'editGlitch', 'editNeon', 'editRainbow', 'editFloating', 'editPulse', 'editShadow'
    ];
    
    checkboxes.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.checked = false;
    });

    const fileInputs = ['editAvatar', 'editBanner', 'editVerified', 'editBgImage', 'editGallery', 'editFiles', 'editMusic'];
    fileInputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
    });

    document.getElementById('bioCount').textContent = '0';
    document.getElementById('usernamePreview').textContent = 'usuario';
    document.getElementById('musicList').innerHTML = '<span>Nenhuma música adicionada</span>';
    document.getElementById('galleryPreview').innerHTML = '<span style="color:var(--muted);font-size:13px;">Nenhuma imagem</span>';
    document.getElementById('filesPreview').innerHTML = '<span style="color:var(--muted);font-size:13px;">Nenhum arquivo</span>';
}

function fillFormWithData(data) {
    const fieldMap = {
        editName: data.name || '',
        editUsername: data.username || '',
        editBio: data.bio || '',
        editLocation: data.location || '',
        editBirthday: data.birthday || '',
        editGender: data.gender || '',
        editPrimary: data.primary || '#8b5cf6',
        editSecondary: data.secondary || '#06b6d4',
        editTextColor: data.textColor || '#ffffff',
        editBgColor: data.bgColor || '#0a0a0f',
        editOpacity: data.opacity || 0.85,
        editBlur: data.blur || 18,
        editRadius: data.radius || 20,
        editPadding: data.padding || 24,
        editFont: data.font || "'Segoe UI', system-ui, sans-serif",
        editFontSize: data.fontSize || 14,
        editVolume: data.volume || 80,
        editAutoplay: data.autoplay ? 'true' : 'false',
        editBgPosition: data.bgPosition || 'center',
        editBgSize: data.bgSize || 'cover'
    };

    Object.entries(fieldMap).forEach(([id, value]) => {
        const el = document.getElementById(id);
        if (el) el.value = value;
    });

    const checkboxMap = {
        editBold: data.bold || false,
        editItalic: data.italic || false,
        editUppercase: data.uppercase || false,
        editGlow: data.glow || false,
        editParticles: data.particles || false,
        editGlitch: data.glitch || false,
        editNeon: data.neon || false,
        editRainbow: data.rainbow || false,
        editFloating: data.floating || false,
        editPulse: data.pulse || false,
        editShadow: data.shadow || false
    };

    Object.entries(checkboxMap).forEach(([id, checked]) => {
        const el = document.getElementById(id);
        if (el) el.checked = checked;
    });

    // Links
    const linkMap = {};
    if (data.links && Array.isArray(data.links)) {
        data.links.forEach(link => {
            linkMap[link.label] = link.url;
        });
    }

    const linkFields = {
        editDiscord: 'Discord',
        editYoutube: 'YouTube',
        editGithub: 'GitHub',
        editTwitter: 'Twitter',
        editInstagram: 'Instagram',
        editTiktok: 'TikTok',
        editLinkedin: 'LinkedIn',
        editTwitch: 'Twitch',
        editSpotify: 'Spotify',
        editWebsite: 'Website'
    };

    Object.entries(linkFields).forEach(([id, label]) => {
        const el = document.getElementById(id);
        if (el) el.value = linkMap[label] || '';
    });

    // Bio count
    document.getElementById('bioCount').textContent = data.bio?.length || 0;

    // Username preview
    document.getElementById('usernamePreview').textContent = data.username || 'usuario';

    // Music list
    if (data.music && Array.isArray(data.music) && data.music.length) {
        document.getElementById('musicList').innerHTML = data.music.map((m, i) => `
            <span style="display:inline-flex;align-items:center;background:rgba(255,255,255,.06);padding:4px 8px;border-radius:8px;margin:2px;">
                🎵 ${escapeHTML(m.title || 'Música ' + (i + 1))}
                <button class="remove-file-btn" onclick="removeMusic(${i})" title="Remover">✕</button>
            </span>
        `).join('');
    }

    // Gallery preview
    if (data.gallery && Array.isArray(data.gallery) && data.gallery.length) {
        document.getElementById('galleryPreview').innerHTML = data.gallery.map((img, i) => `
            <div style="position:relative;display:inline-block;">
                <img src="${escapeHTML(img)}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;">
                <button class="remove-file-btn" onclick="removeGalleryImage(${i})" style="position:absolute;top:2px;right:2px;" title="Remover">✕</button>
            </div>
        `).join('');
    }

    // Files preview
    if (data.files && Array.isArray(data.files) && data.files.length) {
        document.getElementById('filesPreview').innerHTML = data.files.map((f, i) => `
            <span style="display:inline-flex;align-items:center;background:rgba(255,255,255,.06);padding:4px 8px;border-radius:8px;margin:2px;">
                📎 ${escapeHTML(f.name || 'Arquivo ' + (i + 1))}
                <button class="remove-file-btn" onclick="removeFile(${i})" title="Remover">✕</button>
            </span>
        `).join('');
    }
}

function setDefaultValues() {
    document.getElementById('editPrimary').value = '#8b5cf6';
    document.getElementById('editSecondary').value = '#06b6d4';
    document.getElementById('editTextColor').value = '#ffffff';
    document.getElementById('editBgColor').value = '#0a0a0f';
    document.getElementById('editOpacity').value = '0.85';
    document.getElementById('editBlur').value = '18';
    document.getElementById('editRadius').value = '20';
    document.getElementById('editPadding').value = '24';
    document.getElementById('editFontSize').value = '14';
    document.getElementById('editVolume').value = '80';
    document.getElementById('editAutoplay').value = 'false';
    document.getElementById('editBgPosition').value = 'center';
    document.getElementById('editBgSize').value = 'cover';
}

/* Funções para remover itens */
window.removeMusic = function(index) {
    if (!window._editingData?.music) return;
    window._editingData.music.splice(index, 1);
    if (!window._removedFiles) window._removedFiles = { gallery: [], files: [], music: [] };
    window._removedFiles.music.push(index);
    fillFormWithData(window._editingData);
};

window.removeGalleryImage = function(index) {
    if (!window._editingData?.gallery) return;
    window._editingData.gallery.splice(index, 1);
    if (!window._removedFiles) window._removedFiles = { gallery: [], files: [], music: [] };
    window._removedFiles.gallery.push(index);
    fillFormWithData(window._editingData);
};

window.removeFile = function(index) {
    if (!window._editingData?.files) return;
    window._editingData.files.splice(index, 1);
    if (!window._removedFiles) window._removedFiles = { gallery: [], files: [], music: [] };
    window._removedFiles.files.push(index);
    fillFormWithData(window._editingData);
};

window.closeCreator = function() {
    document.getElementById("creatorModal").classList.remove("active");
    window._editingId = null;
    window._editingData = null;
    window._removedFiles = null;
};

/* =========================================================
   SAVE PROFILE - CORRIGIDO
========================================================= */
window.saveProfile = async function() {
    if (!window.currentUser) {
        showToast("🔐", "Faça login primeiro.");
        return;
    }

    const name = document.getElementById("editName").value.trim();
    const username = document.getElementById("editUsername").value.trim().toLowerCase();

    if (!name) {
        showToast("❌", "Digite seu nome.");
        return;
    }

    if (!username) {
        showToast("❌", "Digite um username.");
        return;
    }

    if (!/^[a-z0-9_]+$/.test(username)) {
        showToast("❌", "Username só pode ter letras minúsculas, números e _.");
        return;
    }

    const status = document.getElementById("saveStatus");
    status.textContent = "⏳ Salvando...";

    try {
        // Check username availability
        const snapshot = await get(profilesRef);
        
        if (snapshot.exists()) {
            const data = snapshot.val();
            for (const key in data) {
                if (data[key].username === username && key !== window._editingId) {
                    status.textContent = "";
                    showToast("❌", "Username já está em uso.");
                    return;
                }
            }
        }

        const getVal = id => document.getElementById(id)?.value || "";
        const getCheck = id => document.getElementById(id)?.checked || false;
        const getNum = id => Number(document.getElementById(id)?.value) || 0;

        // Links
        const links = [];
        const linkFields = [
            { id: "editDiscord", label: "Discord" },
            { id: "editYoutube", label: "YouTube" },
            { id: "editGithub", label: "GitHub" },
            { id: "editTwitter", label: "Twitter" },
            { id: "editInstagram", label: "Instagram" },
            { id: "editTiktok", label: "TikTok" },
            { id: "editLinkedin", label: "LinkedIn" },
            { id: "editTwitch", label: "Twitch" },
            { id: "editSpotify", label: "Spotify" },
            { id: "editWebsite", label: "Website" }
        ];

        linkFields.forEach(({id, label}) => {
            const url = document.getElementById(id)?.value.trim();
            if (url) {
                links.push({ label, url });
            }
        });

        // File to Data URL
        const toDataURL = file => new Promise(resolve => {
            if (!file) {
                resolve("");
                return;
            }
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => resolve("");
            reader.readAsDataURL(file);
        });

        // Images
        const avatarFile = document.getElementById("editAvatar").files[0];
        const bannerFile = document.getElementById("editBanner").files[0];
        const verifiedFile = document.getElementById("editVerified").files[0];
        const bgFile = document.getElementById("editBgImage").files[0];
        
        const old = window._editingData || {};
        
        const avatar = avatarFile ? await toDataURL(avatarFile) : (old.avatar || "");
        const banner = bannerFile ? await toDataURL(bannerFile) : (old.banner || "");
        const verified = verifiedFile ? await toDataURL(verifiedFile) : (old.verified || "");
        const bgImage = bgFile ? await toDataURL(bgFile) : (old.bgImage || "");

        // Gallery
        const galleryFiles = document.getElementById("editGallery").files;
        const gallery = [];
        
        for (const file of galleryFiles) {
            gallery.push(await toDataURL(file));
        }

        // Use existing gallery with removals
        let finalGallery = [...(old.gallery || [])];
        
        // Apply removals
        if (window._removedFiles?.gallery?.length) {
            window._removedFiles.gallery.sort((a, b) => b - a).forEach(index => {
                finalGallery.splice(index, 1);
            });
        }
        
        // Add new files
        finalGallery = [...finalGallery, ...gallery];

        // Files
        const fileInputs = document.getElementById("editFiles").files;
        const files = [];
        
        for (const file of fileInputs) {
            files.push({
                name: file.name,
                data: await toDataURL(file)
            });
        }

        let finalFiles = [...(old.files || [])];
        
        if (window._removedFiles?.files?.length) {
            window._removedFiles.files.sort((a, b) => b - a).forEach(index => {
                finalFiles.splice(index, 1);
            });
        }
        
        finalFiles = [...finalFiles, ...files];

        // Music
        const musicFiles = document.getElementById("editMusic").files;
        const music = [];
        
        for (const file of musicFiles) {
            if (file.size > 50 * 1024 * 1024) {
                showToast("⚠️", `"${file.name}" excede 50MB.`);
                continue;
            }
            
            music.push({
                title: file.name.replace(/\.[^/.]+$/, ""),
                artist: "Artista",
                blob: await toDataURL(file)
            });
        }

        let finalMusic = [...(old.music || [])];
        
        if (window._removedFiles?.music?.length) {
            window._removedFiles.music.sort((a, b) => b - a).forEach(index => {
                finalMusic.splice(index, 1);
            });
        }
        
        finalMusic = [...finalMusic, ...music];

        // Stats - preserve existing
        const oldStats = old.stats || {
            views: Number(old.views) || 0,
            likes: 0,
            followers: Number(old.followers) || 0
        };

        // Profile data
        const profileData = {
            ownerUid: old.ownerUid || window.currentUser.uid,
            name,
            username,
            bio: getVal("editBio"),
            location: getVal("editLocation"),
            birthday: getVal("editBirthday"),
            gender: getVal("editGender"),
            primary: getVal("editPrimary") || "#8b5cf6",
            secondary: getVal("editSecondary") || "#06b6d4",
            textColor: getVal("editTextColor") || "#ffffff",
            bgColor: getVal("editBgColor") || "#0a0a0f",
            opacity: parseFloat(getVal("editOpacity")) || .85,
            blur: getNum("editBlur") || 18,
            radius: getNum("editRadius") || 20,
            padding: getNum("editPadding") || 24,
            font: getVal("editFont") || "'Segoe UI', system-ui, sans-serif",
            fontSize: getNum("editFontSize") || 14,
            bold: getCheck("editBold"),
            italic: getCheck("editItalic"),
            uppercase: getCheck("editUppercase"),
            glow: getCheck("editGlow"),
            particles: getCheck("editParticles"),
            glitch: getCheck("editGlitch"),
            neon: getCheck("editNeon"),
            rainbow: getCheck("editRainbow"),
            floating: getCheck("editFloating"),
            pulse: getCheck("editPulse"),
            shadow: getCheck("editShadow"),
            autoplay: getVal("editAutoplay") === "true",
            volume: getNum("editVolume") || 80,
            bgPosition: getVal("editBgPosition") || "center",
            bgSize: getVal("editBgSize") || "cover",
            avatar,
            banner,
            verified,
            bgImage,
            gallery: finalGallery,
            files: finalFiles,
            music: finalMusic,
            links,
            stats: oldStats,
            likes: old.likes || {},
            followers: old.followers || {},
            createdAt: old.createdAt || Date.now(),
            updatedAt: Date.now()
        };

        // Save
        if (window._editingId) {
            // Security check
            if (old.ownerUid && old.ownerUid !== window.currentUser.uid) {
                showToast("❌", "Você não é o dono desse perfil.");
                return;
            }

            await set(ref(db, `profiles/${window._editingId}`), profileData);
            showToast("✅", "Perfil atualizado!");
        } else {
            const newRef = push(profilesRef);
            profileData.ownerUid = window.currentUser.uid;
            await set(newRef, profileData);
            showToast("🎉", "Perfil criado!");
        }

        closeCreator();
        await loadProfiles();
    } catch (error) {
        console.error(error);
        status.textContent = "";
        showToast("❌", "Erro ao salvar: " + error.message);
    }
};

/* =========================================================
   DELETE
========================================================= */
window.deleteProfile = async function(id) {
    if (!window.currentUser) {
        showToast("🔐", "Faça login.");
        return;
    }

    const profile = window._profilesData.find(p => p.id === id);
    if (!profile) return;

    if (profile.ownerUid !== window.currentUser.uid) {
        showToast("❌", "Você não é o dono desse perfil.");
        return;
    }

    if (!confirm("Tem certeza que deseja excluir este perfil?")) {
        return;
    }

    try {
        await remove(ref(db, `profiles/${id}`));
        closeProfileViewer();
        showToast("🗑️", "Perfil removido.");
        await loadProfiles();
    } catch (error) {
        console.error(error);
        showToast("❌", "Erro ao excluir o perfil.");
    }
};

/* =========================================================
   VISITOR ID
========================================================= */
function getVisitorId() {
    let id = localStorage.getItem("perfilme_visitor_id");
    if (!id) {
        id = crypto.randomUUID ? crypto.randomUUID() : "v_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        localStorage.setItem("perfilme_visitor_id", id);
    }
    return id.replace(/[.#$\[\]/]/g, "_");
}

/* =========================================================
   STATS - CORRIGIDO
========================================================= */
function getStats(profile) {
    const stats = profile.stats || {};
    return {
        views: Number(stats.views ?? profile.views ?? 0),
        likes: Number(stats.likes ?? 0),
        followers: Number(stats.followers ?? profile.followers ?? 0)
    };
}

function getMapCount(map) {
    return (map && typeof map === "object") ? Object.keys(map).length : 0;
}

function hasUserAction(profile, type) {
    const visitorId = getVisitorId();
    return !!(profile?.[type]?.[visitorId]);
}

/* =========================================================
   ESCAPE
========================================================= */
function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    }[c]));
}

/* =========================================================
   NUMBER
========================================================= */
function formatNumber(number) {
    return Number(number || 0).toLocaleString("pt-BR");
}

/* =========================================================
   LINKS
========================================================= */
function linkHTML(links) {
    if (!Array.isArray(links) || !links.length) {
        return `<span class="viewer-empty">Nenhum link adicionado.</span>`;
    }
    return links.map(l => `
        <a href="${escapeHTML(l.url)}" target="_blank" rel="noopener noreferrer">
            🔗 ${escapeHTML(l.label)}
        </a>
    `).join("");
}

/* =========================================================
   GALLERY
========================================================= */
function galleryHTML(gallery) {
    if (!Array.isArray(gallery) || !gallery.length) {
        return `<span class="viewer-empty">Nenhuma imagem na galeria.</span>`;
    }
    return gallery.map(img => `
        <img src="${escapeHTML(img)}" alt="Imagem" loading="lazy">
    `).join("");
}

/* =========================================================
   MUSIC
========================================================= */
function musicHTML(music, autoplay, volume) {
    if (!Array.isArray(music) || !music.length) {
        return `<span class="viewer-empty">Nenhuma música adicionada.</span>`;
    }
    return music.map((m, i) => {
        const auto = autoplay && i === 0 ? "autoplay" : "";
        const vol = Math.max(0, Math.min(100, Number(volume ?? 80))) / 100;
        return `
            <div>
                <div style="font-size:13px;margin-bottom:5px;">
                    🎵 ${escapeHTML(m.title || "Música " + (i + 1))}
                </div>
                <audio controls ${auto} src="${escapeHTML(m.blob || "")}" data-volume="${vol}"></audio>
            </div>
        `;
    }).join("");
}

/* =========================================================
   OPEN PROFILE
========================================================= */
window.openProfile = async function(id) {
    const profile = window._profilesData.find(p => p.id === id);
    if (!profile) return;

    window._viewingProfileId = id;
    window._viewingProfile = profile;
    document.getElementById("profileViewerModal").classList.add("active");
    renderProfileViewer(profile);

    // Increment views
    try {
        const statsRef = ref(db, `profiles/${id}/stats/views`);
        const result = await runTransaction(statsRef, current => Number(current || 0) + 1);
        
        if (result.committed) {
            profile.stats = profile.stats || {};
            profile.stats.views = result.snapshot.val();
            renderProfileViewer(profile);
            loadProfiles();
        }
    } catch (error) {
        console.error("Erro ao registrar visualização:", error);
    }
};

/* =========================================================
   RENDER PROFILE - CORRIGIDO
========================================================= */
function renderProfileViewer(profile) {
    const stats = getStats(profile);
    const likes = getMapCount(profile.likes) || stats.likes;
    const followers = getMapCount(profile.followers) || stats.followers;
    const liked = hasUserAction(profile, "likes");
    const following = hasUserAction(profile, "followers");
    const isOwner = !!(window.currentUser && profile.ownerUid === window.currentUser.uid);

    const bannerStyle = profile.banner
        ? `background-image: url("${escapeHTML(profile.banner)}");`
        : `background: linear-gradient(135deg, ${escapeHTML(profile.primary || "#8b5cf6")}, ${escapeHTML(profile.secondary || "#06b6d4")});`;

    const avatar = profile.avatar || `https://placehold.co/200x200/14141e/ffffff?text=${encodeURIComponent((profile.name || "?").charAt(0))}`.replace(/\s/g, "");

    document.getElementById("profileViewerContent").innerHTML = `
        <div class="viewer-banner" style="${bannerStyle}"></div>
        <div class="viewer-content">
            <div class="viewer-head">
                <div>
                    <img class="viewer-avatar" src="${escapeHTML(avatar)}" alt="Avatar">
                    <div class="viewer-name" style="color:${escapeHTML(profile.primary || "#fff")};">
                        ${escapeHTML(profile.name)}
                    </div>
                    <div class="viewer-username">@${escapeHTML(profile.username)}</div>
                    ${isOwner ? '<div class="owner-badge">👑 Seu perfil</div>' : ''}
                </div>
            </div>

            ${profile.bio ? `<div class="viewer-bio">${escapeHTML(profile.bio)}</div>` : ''}
            ${profile.location ? `<div class="viewer-location">📍 ${escapeHTML(profile.location)}</div>` : ''}

            <div class="viewer-stats">
                <div class="viewer-stat">
                    <strong id="viewerViews">${formatNumber(stats.views)}</strong>
                    <span>Visualizações</span>
                </div>
                <div class="viewer-stat">
                    <strong id="viewerLikes">${formatNumber(likes)}</strong>
                    <span>Curtidas</span>
                </div>
                <div class="viewer-stat">
                    <strong id="viewerFollowers">${formatNumber(followers)}</strong>
                    <span>Seguidores</span>
                </div>
                <div class="viewer-stat">
                    <strong>${formatNumber(profile.posts || 0)}</strong>
                    <span>Posts</span>
                </div>
            </div>

            ${isOwner ? `
                <div class="owner-tools">
                    <button class="btn btn-primary" onclick="editViewedProfile()">✏️ Editar perfil</button>
                    <button class="btn btn-danger" onclick="deleteProfile('${escapeHTML(profile.id)}')">🗑️ Excluir</button>
                </div>
            ` : `
                <div class="viewer-actions">
                    <button id="likeButton" class="btn ${liked ? 'active' : ''}" onclick="toggleLike()">
                        ${liked ? '❤️ Curtido' : '🤍 Curtir'}
                    </button>
                    <button id="followButton" class="btn ${following ? 'active' : ''}" onclick="toggleFollow()">
                        ${following ? '👤 Seguindo' : '➕ Seguir'}
                    </button>
                </div>
            `}

            <div class="viewer-section">
                <h3>🔗 Links</h3>
                <div class="viewer-links">${linkHTML(profile.links)}</div>
            </div>

            <div class="viewer-section">
                <h3>🖼️ Galeria</h3>
                <div class="viewer-gallery">${galleryHTML(profile.gallery)}</div>
            </div>

            <div class="viewer-section">
                <h3>🎵 Música</h3>
                <div class="viewer-music">${musicHTML(profile.music, profile.autoplay, profile.volume)}</div>
            </div>
        </div>
    `;

    // Set volume
    document.querySelectorAll(".viewer-music audio").forEach(audio => {
        audio.volume = Number(audio.dataset.volume) || .8;
    });
}

/* =========================================================
   CLOSE VIEWER
========================================================= */
window.closeProfileViewer = function() {
    document.getElementById("profileViewerModal").classList.remove("active");
    document.getElementById("profileViewerContent").innerHTML = "";
    window._viewingProfileId = null;
    window._viewingProfile = null;
};

/* =========================================================
   EDIT VIEWED PROFILE
========================================================= */
window.editViewedProfile = function() {
    const profile = window._viewingProfile;
    if (!profile) return;

    if (!window.currentUser) {
        showToast("🔐", "Faça login.");
        return;
    }

    if (profile.ownerUid !== window.currentUser.uid) {
        showToast("❌", "Você não é o dono desse perfil.");
        return;
    }

    closeProfileViewer();
    window._editingData = profile;
    openCreator(profile);
};

/* =========================================================
   LIKE - CORRIGIDO
========================================================= */
window.toggleLike = async function() {
    if (!window.currentUser) {
        showToast("🔐", "Faça login para curtir.");
        openAuth();
        return;
    }

    const id = window._viewingProfileId;
    if (!id) return;

    const visitorId = getVisitorId();
    const markerRef = ref(db, `profiles/${id}/likes/${visitorId}`);

    try {
        const result = await runTransaction(markerRef, current => current ? null : true);
        
        if (!result.committed) return;

        const profile = window._profilesData.find(p => p.id === id);
        if (!profile) return;

        profile.likes = profile.likes || {};
        
        if (result.snapshot.exists()) {
            profile.likes[visitorId] = true;
        } else {
            delete profile.likes[visitorId];
        }

        profile.stats = profile.stats || {};
        profile.stats.likes = getMapCount(profile.likes);
        window._viewingProfile = profile;
        renderProfileViewer(profile);
        
        showToast(
            result.snapshot.exists() ? "❤️" : "🤍",
            result.snapshot.exists() ? "Curtida adicionada!" : "Curtida removida!"
        );
        
        loadProfiles();
    } catch (error) {
        console.error(error);
        showToast("❌", "Não foi possível registrar a curtida.");
    }
};

/* =========================================================
   FOLLOW - CORRIGIDO
========================================================= */
window.toggleFollow = async function() {
    if (!window.currentUser) {
        showToast("🔐", "Faça login para seguir.");
        openAuth();
        return;
    }

    const id = window._viewingProfileId;
    if (!id) return;

    const visitorId = getVisitorId();
    const markerRef = ref(db, `profiles/${id}/followers/${visitorId}`);

    try {
        const result = await runTransaction(markerRef, current => current ? null : true);
        
        if (!result.committed) return;

        const profile = window._profilesData.find(p => p.id === id);
        if (!profile) return;

        profile.followers = profile.followers || {};
        
        if (result.snapshot.exists()) {
            profile.followers[visitorId] = true;
        } else {
            delete profile.followers[visitorId];
        }

        profile.stats = profile.stats || {};
        profile.stats.followers = getMapCount(profile.followers);
        window._viewingProfile = profile;
        renderProfileViewer(profile);
        
        showToast(
            result.snapshot.exists() ? "👤" : "👋",
            result.snapshot.exists() ? "Você está seguindo!" : "Você deixou de seguir."
        );
        
        loadProfiles();
    } catch (error) {
        console.error(error);
        showToast("❌", "Não foi possível alterar o seguimento.");
    }
};

/* =========================================================
   FILTER
========================================================= */
window.filterProfiles = function() {
    const term = document.getElementById("searchInput").value.toLowerCase();
    const items = document.querySelectorAll(".profile-card-link");
    
    items.forEach(item => {
        const text = item.dataset.search || "";
        item.style.display = text.includes(term) ? "" : "none";
    });
};

/* =========================================================
   TOAST
========================================================= */
function showToast(icon, message) {
    const toast = document.getElementById("toast");
    document.getElementById("toastIcon").textContent = icon;
    document.getElementById("toastMessage").textContent = message;
    toast.className = "toast show";
    
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
        toast.className = "toast";
    }, 3000);
}

/* =========================================================
   LOAD PROFILES - CORRIGIDO
========================================================= */
async function loadProfiles() {
    const container = document.getElementById("profilesGrid");
    
    try {
        const snapshot = await get(profilesRef);
        
        if (!snapshot.exists()) {
            window._profilesData = [];
            container.innerHTML = `
                <div class="empty-state">
                    <span class="emoji">🌟</span>
                    <h3>Nenhum perfil ainda</h3>
                    <p style="color:var(--muted);margin-top:8px;">Seja o primeiro a criar seu perfil Ultra!</p>
                    <button class="btn btn-primary" onclick="openCreator()" style="margin-top:16px">Criar Perfil</button>
                </div>
            `;
            return;
        }

        const data = snapshot.val();
        const profiles = Object.entries(data).map(([id, p]) => {
            const profile = { id, ...p };
            
            profile.stats = profile.stats || {
                views: Number(profile.views) || 0,
                likes: 0,
                followers: Number(profile.followers) || 0
            };
            
            profile.likes = (profile.likes && typeof profile.likes === "object") ? profile.likes : {};
            profile.followers = (profile.followers && typeof profile.followers === "object") ? profile.followers : {};
            
            profile.stats.views = Number(profile.stats.views || 0);
            profile.stats.likes = getMapCount(profile.likes);
            profile.stats.followers = getMapCount(profile.followers);
            
            return profile;
        });

        profiles.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        window._profilesData = profiles;

        container.innerHTML = profiles.map(p => {
            const safeName = escapeHTML(p.name || "Perfil");
            const safeUsername = escapeHTML(p.username || "");
            const avatar = p.avatar || `https://placehold.co/200x200/14141e/ffffff?text=${encodeURIComponent((p.name || "?").charAt(0))}`;
            
            return `
                <a href="?u=${encodeURIComponent(p.username || "")}" 
                   class="profile-card-link" 
                   data-search="${escapeHTML(((p.name || "") + " " + (p.username || "")).toLowerCase())}"
                   onclick="openProfile('${escapeHTML(p.id)}'); history.replaceState(null, '', '?u=${encodeURIComponent(p.username || '')}'); return false;">
                    
                    <div class="profile-card-mini" style="${p.primary ? `border-color: ${escapeHTML(p.primary)}44;` : ''}">
                        <img class="avatar-mini" src="${escapeHTML(avatar)}" alt="">
                        <div class="name" style="${p.primary ? `color: ${escapeHTML(p.primary)};` : ''}">${safeName}</div>
                        <div class="username">@${safeUsername}</div>
                        
                        ${p.bio ? `<div class="bio-mini">${escapeHTML(p.bio)}</div>` : ''}
                        
                        <div class="tags">
                            ${p.location ? `<span class="tag">📍 ${escapeHTML(p.location)}</span>` : ''}
                            ${p.music?.length ? `<span class="tag">🎵 ${p.music.length}</span>` : ''}
                            ${p.gallery?.length ? `<span class="tag">🖼️ ${p.gallery.length}</span>` : ''}
                        </div>
                        
                        <div class="tags">
                            <span class="tag">👁️ ${formatNumber(p.stats.views)}</span>
                            <span class="tag">❤️ ${formatNumber(p.stats.likes)}</span>
                            <span class="tag">👤 ${formatNumber(p.stats.followers)}</span>
                        </div>
                        
                        <div class="badge-mini">✨ perfil.me/?u=${safeUsername}</div>
                        <div class="link-icon">🔗</div>
                    </div>
                </a>
            `;
        }).join("");

        // Open profile from URL
        const params = new URLSearchParams(location.search);
        const username = params.get("u");
        
        if (username) {
            const target = profiles.find(p => String(p.username).toLowerCase() === String(username).toLowerCase());
            if (target) {
                openProfile(target.id);
            }
        }
    } catch (error) {
        console.error(error);
        container.innerHTML = `
            <div class="empty-state">
                <span class="emoji">⚠️</span>
                <h3>Erro ao carregar</h3>
                <p style="color:var(--muted);margin-top:8px;">${escapeHTML(error.message)}</p>
            </div>
        `;
    }
}

/* =========================================================
   RANGE LABELS
========================================================= */
function updateRangeLabels() {
    document.getElementById("opacityValue").textContent = document.getElementById("editOpacity").value;
    document.getElementById("blurValue").textContent = document.getElementById("editBlur").value + "px";
    document.getElementById("radiusValue").textContent = document.getElementById("editRadius").value + "px";
    document.getElementById("paddingValue").textContent = document.getElementById("editPadding").value + "px";
}

/* =========================================================
   EVENTS
========================================================= */
document.getElementById("editUsername").addEventListener("input", function() {
    this.value = this.value.toLowerCase().replace(/[^a-z0-9_]/g, "");
    document.getElementById("usernamePreview").textContent = this.value || "usuario";
});

document.getElementById("editBio").addEventListener("input", function() {
    document.getElementById("bioCount").textContent = this.value.length;
});

document.getElementById("editOpacity").addEventListener("input", updateRangeLabels);
document.getElementById("editBlur").addEventListener("input", updateRangeLabels);
document.getElementById("editRadius").addEventListener("input", updateRangeLabels);
document.getElementById("editPadding").addEventListener("input", updateRangeLabels);

/* =========================================================
   ESC
========================================================= */
document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
        closeCreator();
        closeProfileViewer();
        closeAuth();
    }
});

/* =========================================================
   CLICK OUTSIDE
========================================================= */
document.getElementById("profileViewerModal").addEventListener("click", function(e) {
    if (e.target === this) closeProfileViewer();
});

document.getElementById("creatorModal").addEventListener("click", function(e) {
    if (e.target === this) closeCreator();
});

document.getElementById("authModal").addEventListener("click", function(e) {
    if (e.target === this) closeAuth();
});

console.log("🚀 Perfil.me Ultra iniciado.");
