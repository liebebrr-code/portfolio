<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #8b5cf6;
            --secondary: #6366f1;
            --text: #ffffff;
            --muted: #a1a1aa;
        }
        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: var(--text);
            background: #08080b;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #background {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            background-size: cover;
            background-position: center;
            animation: bgMove 30s infinite;
        }
        #background::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,.5);
        }
        @keyframes bgMove {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .profile-card {
            width: min(500px, 100%);
            border-radius: 20px;
            overflow: hidden;
            background: rgba(18,18,23,.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.1);
            box-shadow: 0 30px 80px rgba(0,0,0,.6);
        }
        .banner {
            height: 150px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            background-size: cover;
            background-position: center;
        }
        .content {
            padding: 0 25px 30px;
            text-align: center;
        }
        .avatar {
            width: 100px;
            height: 100px;
            margin-top: -50px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,.2);
            object-fit: cover;
            background: #18181b;
        }
        h1 { margin-top: 10px; font-size: 24px; }
        .username { color: var(--muted); font-size: 14px; margin-top: 4px; }
        .bio { margin-top: 15px; color: #e4e4e7; font-size: 14px; line-height: 1.6; }
        .badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: rgba(139,92,246,.2);
            border: 1px solid var(--primary);
            color: #c4b5fd;
        }
        .badge.secret {
            background: rgba(239,68,68,.2);
            border-color: #ef4444;
            color: #fca5a5;
        }
        .links {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .links a {
            padding: 8px 15px;
            border-radius: 10px;
            background: rgba(255,255,255,.08);
            color: white;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,.1);
            transition: .2s;
        }
        .links a:hover {
            border-color: var(--primary);
            background: rgba(139,92,246,.2);
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: var(--muted);
            padding: 50px;
        }
        .edit-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
        }
        .edit-btn:hover {
            background: var(--secondary);
        }
        #editorModal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.9);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            overflow-y: auto;
        }
        .hidden { display: none !important; }
        .editor {
            width: min(500px, 100%);
            background: #18181b;
            border-radius: 15px;
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .editor h2 { margin-bottom: 20px; font-size: 20px; }
        .editor label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-top: 12px;
            color: #d4d4d8;
        }
        .editor input, .editor textarea {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.15);
            background: #09090b;
            color: white;
            font-size: 14px;
        }
        .editor textarea { min-height: 80px; resize: vertical; }
        .editor button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            background: var(--primary);
            color: white;
        }
        .editor .cancel-btn {
            background: rgba(255,255,255,.1);
            margin-left: 10px;
        }
        .success-msg {
            color: #4ade80;
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="background"></div>
    
    <button class="edit-btn" onclick="openEditor()">✏️ Editar</button>
    
    <div class="profile-card" id="profileCard">
        <div class="loading" id="loading">Carregando perfil...</div>
        <div id="profileContent" class="hidden">
            <div class="banner" id="banner"></div>
            <div class="content">
                <img id="avatar" class="avatar" alt="Avatar">
                <h1><span id="name"></span> ✓</h1>
                <div class="username" id="username"></div>
                <p class="bio" id="bio"></p>
                <div class="badge" id="badge">✨ Perfil Normal</div>
                <div class="links" id="links"></div>
            </div>
        </div>
    </div>
    
    <div id="editorModal" class="hidden">
        <div class="editor">
            <h2>✏️ Editar Perfil</h2>
            
            <label>Nome</label>
            <input id="editName" placeholder="Seu nome">
            
            <label>Username</label>
            <input id="editUsername" placeholder="@usuario">
            
            <label>Biografia</label>
            <textarea id="editBio" placeholder="Sua bio"></textarea>
            
            <label>Avatar (URL ou upload)</label>
            <input id="avatarInput" type="file" accept="image/*">
            
            <label>Banner (URL ou upload)</label>
            <input id="bannerInput" type="file" accept="image/*">
            
            <label>Fundo (URL ou upload)</label>
            <input id="backgroundInput" type="file" accept="image/*">
            
            <label>Cor Principal</label>
            <input id="editPrimary" type="color" value="#8b5cf6">
            
            <label>Cor Secundária</label>
            <input id="editSecondary" type="color" value="#6366f1">
            
            <label>Discord</label>
            <input id="editDiscord" placeholder="https://discord.gg/...">
            
            <label>YouTube</label>
            <input id="editYoutube" placeholder="https://youtube.com/...">
            
            <label>GitHub</label>
            <input id="editGithub" placeholder="https://github.com/...">
            
            <label>Chance do Perfil Secreto (%)</label>
            <input id="editSecretChance" type="number" min="0" max="100" value="30">
            
            <label>Nome Secreto</label>
            <input id="editSecretName" placeholder="Nome secreto">
            
            <label>Bio Secreta</label>
            <textarea id="editSecretBio" placeholder="Bio secreta"></textarea>
            
            <div>
                <button onclick="saveProfile()">💾 Salvar e Publicar</button>
                <button class="cancel-btn" onclick="closeEditor()">Cancelar</button>
            </div>
            <div class="success-msg" id="saveMsg"></div>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyB35ktkxiS_MPTrSflfHhBe5snYAV0iV6Q",
            authDomain: "myprofile-7db79.firebaseapp.com",
            databaseURL: "https://myprofile-7db79-default-rtdb.firebaseio.com",
            projectId: "myprofile-7db79",
            storageBucket: "myprofile-7db79.firebasestorage.app",
            messagingSenderId: "947862565874",
            appId: "1:947862565874:web:3116335ff6f1822f0df16b"
        };
        
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        window.saveToFirebase = async function(data) {
            await set(ref(database, "profile"), data);
        };
        
        window.loadFromFirebase = async function() {
            const snapshot = await get(ref(database, "profile"));
            if (snapshot.exists()) return snapshot.val();
            return null;
        };
        
        // Carregar perfil ao abrir
        const savedProfile = await window.loadFromFirebase();
        if (savedProfile) {
            window.profileData = savedProfile;
            window.applyProfile(savedProfile);
        } else {
            document.getElementById("loading").textContent = "Nenhum perfil salvo ainda.";
        }
    </script>
    
    <script>
        window.profileData = null;
        
        window.applyProfile = function(data) {
            const isSecret = Math.random() * 100 < (data.secretChance || 0);
            const profile = isSecret && data.secretName ? {
                name: data.secretName,
                username: data.username || "",
                bio: data.secretBio || "",
                avatar: data.avatar || ""
            } : {
                name: data.name || "Sem nome",
                username: data.username || "",
                bio: data.bio || "",
                avatar: data.avatar || ""
            };
            
            document.getElementById("name").textContent = profile.name;
            document.getElementById("username").textContent = profile.username;
            document.getElementById("bio").textContent = profile.bio;
            
            if (profile.avatar) {
                document.getElementById("avatar").src = profile.avatar;
            } else {
                document.getElementById("avatar").src = "https://placehold.co/300x300/18181b/ffffff?text=PERFIL";
            }
            
            if (data.banner) {
                document.getElementById("banner").style.backgroundImage = `url("${data.banner}")`;
                document.getElementById("banner").style.backgroundSize = "cover";
            }
            
            if (data.background) {
                document.getElementById("background").style.backgroundImage = `url("${data.background}")`;
                document.getElementById("background").style.backgroundSize = "cover";
            }
            
            if (data.primary) {
                document.documentElement.style.setProperty("--primary", data.primary);
            }
            if (data.secondary) {
                document.documentElement.style.setProperty("--secondary", data.secondary);
            }
            
            const badge = document.getElementById("badge");
            if (isSecret && data.secretName) {
                badge.textContent = "🔒 Perfil Secreto";
                badge.className = "badge secret";
            } else {
                badge.textContent = "✨ Perfil Normal";
                badge.className = "badge";
            }
            
            const linksContainer = document.getElementById("links");
            linksContainer.innerHTML = "";
            if (data.discord) {
                const a = document.createElement("a");
                a.href = data.discord;
                a.target = "_blank";
                a.textContent = "Discord";
                linksContainer.appendChild(a);
            }
            if (data.youtube) {
                const a = document.createElement("a");
                a.href = data.youtube;
                a.target = "_blank";
                a.textContent = "YouTube";
                linksContainer.appendChild(a);
            }
            if (data.github) {
                const a = document.createElement("a");
                a.href = data.github;
                a.target = "_blank";
                a.textContent = "GitHub";
                linksContainer.appendChild(a);
            }
            
            document.getElementById("loading").classList.add("hidden");
            document.getElementById("profileContent").classList.remove("hidden");
        };
        
        function openEditor() {
            const data = window.profileData || {};
            document.getElementById("editName").value = data.name || "";
            document.getElementById("editUsername").value = data.username || "";
            document.getElementById("editBio").value = data.bio || "";
            document.getElementById("editPrimary").value = data.primary || "#8b5cf6";
            document.getElementById("editSecondary").value = data.secondary || "#6366f1";
            document.getElementById("editDiscord").value = data.discord || "";
            document.getElementById("editYoutube").value = data.youtube || "";
            document.getElementById("editGithub").value = data.github || "";
            document.getElementById("editSecretChance").value = data.secretChance || 30;
            document.getElementById("editSecretName").value = data.secretName || "";
            document.getElementById("editSecretBio").value = data.secretBio || "";
            document.getElementById("editorModal").classList.remove("hidden");
        }
        
        function closeEditor() {
            document.getElementById("editorModal").classList.add("hidden");
        }
        
        function fileToDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        
        async function saveProfile() {
            const data = {
                name: document.getElementById("editName").value,
                username: document.getElementById("editUsername").value,
                bio: document.getElementById("editBio").value,
                primary: document.getElementById("editPrimary").value,
                secondary: document.getElementById("editSecondary").value,
                discord: document.getElementById("editDiscord").value,
                youtube: document.getElementById("editYoutube").value,
                github: document.getElementById("editGithub").value,
                secretChance: Number(document.getElementById("editSecretChance").value),
                secretName: document.getElementById("editSecretName").value,
                secretBio: document.getElementById("editSecretBio").value
            };
            
            const avatarFile = document.getElementById("avatarInput").files[0];
            if (avatarFile) data.avatar = await fileToDataURL(avatarFile);
            else data.avatar = window.profileData?.avatar || "";
            
            const bannerFile = document.getElementById("bannerInput").files[0];
            if (bannerFile) data.banner = await fileToDataURL(bannerFile);
            else data.banner = window.profileData?.banner || "";
            
            const bgFile = document.getElementById("backgroundInput").files[0];
            if (bgFile) data.background = await fileToDataURL(bgFile);
            else data.background = window.profileData?.background || "";
            
            window.profileData = data;
            
            try {
                await window.saveToFirebase(data);
                document.getElementById("saveMsg").textContent = "✅ Salvo com sucesso!";
                window.applyProfile(data);
                setTimeout(() => { document.getElementById("saveMsg").textContent = ""; }, 2000);
            } catch(e) {
                document.getElementById("saveMsg").textContent = "❌ Erro ao salvar. Verifique as regras do Firebase!";
                console.error(e);
            }
        }
    </script>
</body>
</html>
