<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Perfil</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #8b5cf6;
    --secondary: #06b6d4;
    --accent: #a78bfa;

    --text: #ffffff;
    --muted: #a1a1aa;

    --card: rgba(15, 15, 25, .72);
    --border: rgba(255,255,255,.12);

    --blur: 18px;
    --radius: 24px;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #050509;
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* =========================================================
   FUNDO
========================================================= */

#background {
    position: fixed;
    inset: 0;
    z-index: -10;

    background:
        radial-gradient(
            circle at center,
            rgba(139,92,246,.15),
            transparent 55%
        ),
        #050509;

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    transition:
        background-image 1.2s ease,
        opacity 1s ease,
        filter .5s ease;
}

#background::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,0,0,.7)
        );
}

#background.blur {
    filter: blur(8px);
    transform: scale(1.05);
}

/* =========================================================
   OVERLAY
========================================================= */

#overlay {
    position: fixed;
    inset: 0;
    z-index: -5;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(139,92,246,.18),
            transparent 45%
        );
}

/* =========================================================
   PERFIL
========================================================= */

.profile-wrapper {
    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 40px 18px;
}

.profile-card {
    width: min(760px, 100%);

    padding: 34px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));

    box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        0 0 80px rgba(139,92,246,.08);

    animation: cardIn .8s ease;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =========================================================
   AVATAR
========================================================= */

.avatar-container {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

.avatar {
    width: 125px;
    height: 125px;

    border-radius: 50%;

    object-fit: cover;

    border: 4px solid rgba(255,255,255,.15);

    box-shadow:
        0 0 0 5px rgba(139,92,246,.08),
        0 15px 50px rgba(0,0,0,.5);

    background: #111;
}

/* =========================================================
   TEXTO
========================================================= */

.profile-name {
    text-align: center;

    font-size: clamp(30px, 6vw, 48px);
    font-weight: 900;

    letter-spacing: -1px;

    margin-bottom: 8px;

    text-shadow:
        0 0 25px rgba(139,92,246,.35);
}

.profile-description {
    text-align: center;

    color: var(--muted);

    line-height: 1.6;

    max-width: 600px;

    margin: auto;

    white-space: pre-wrap;
}

/* =========================================================
   BADGE
========================================================= */

.badges {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;

    margin-top: 18px;
}

.badge {
    padding: 7px 12px;

    border-radius: 999px;

    background: rgba(139,92,246,.15);

    border: 1px solid rgba(139,92,246,.25);

    font-size: 13px;

    color: #ddd6fe;
}

/* =========================================================
   LINKS
========================================================= */

.links {
    display: flex;
    flex-direction: column;

    gap: 12px;

    margin-top: 30px;
}

.social-link {
    width: 100%;

    padding: 15px 18px;

    border-radius: 16px;

    background: rgba(255,255,255,.06);

    border: 1px solid rgba(255,255,255,.08);

    color: white;

    text-decoration: none;

    text-align: center;

    font-weight: 700;

    transition: .25s;
}

.social-link:hover {
    transform: translateY(-3px);

    background: rgba(139,92,246,.18);

    border-color: rgba(139,92,246,.4);

    box-shadow:
        0 10px 35px rgba(139,92,246,.12);
}

/* =========================================================
   PLAYER
========================================================= */

.music-player {
    margin-top: 30px;

    padding: 18px;

    border-radius: 20px;

    background: rgba(0,0,0,.25);

    border: 1px solid rgba(255,255,255,.08);
}

.music-title {
    font-weight: 800;
    margin-bottom: 12px;
}

.music-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

.music-btn {
    width: 42px;
    height: 42px;

    border: none;

    border-radius: 50%;

    background: rgba(139,92,246,.2);

    color: white;

    cursor: pointer;

    transition: .2s;
}

.music-btn:hover {
    background: rgba(139,92,246,.4);

    transform: scale(1.05);
}

.music-progress {
    flex: 1;

    height: 5px;

    appearance: none;

    border-radius: 999px;

    background: rgba(255,255,255,.12);

    cursor: pointer;
}

.volume {
    width: 90px;
}

.music-time {
    display: flex;
    justify-content: space-between;

    color: #a1a1aa;

    font-size: 12px;

    margin-top: 8px;
}

.playlist {
    margin-top: 14px;

    display: flex;
    flex-direction: column;

    gap: 7px;

    max-height: 160px;

    overflow-y: auto;
}

.playlist-item {
    padding: 10px 12px;

    border-radius: 10px;

    cursor: pointer;

    color: #aaa;

    transition: .2s;
}

.playlist-item:hover,
.playlist-item.active {
    background: rgba(139,92,246,.14);

    color: white;
}

/* =========================================================
   ADMIN BUTTON
========================================================= */

.admin-button {
    position: fixed;

    right: 18px;
    bottom: 18px;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.12);

    background: rgba(10,10,15,.75);

    backdrop-filter: blur(12px);

    color: white;

    cursor: pointer;

    z-index: 100;

    opacity: .25;

    transition: .25s;
}

.admin-button:hover {
    opacity: 1;

    transform: scale(1.08);
}

/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 18px;

    background: rgba(0,0,0,.72);

    backdrop-filter: blur(10px);
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(900px, 100%);
    max-height: 92vh;

    overflow-y: auto;

    padding: 25px;

    border-radius: 24px;

    background: #0c0c13;

    border: 1px solid rgba(255,255,255,.1);

    box-shadow: 0 30px 100px rgba(0,0,0,.7);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 22px;
}

.modal-header h2 {
    font-size: 24px;
}

.close {
    width: 40px;
    height: 40px;

    border: none;

    border-radius: 10px;

    background: rgba(255,255,255,.06);

    color: white;

    cursor: pointer;

    font-size: 20px;
}

/* =========================================================
   LOGIN
========================================================= */

.login-box {
    width: min(420px, 100%);
}

.input {
    width: 100%;

    padding: 13px 14px;

    margin-bottom: 12px;

    border-radius: 12px;

    border: 1px solid rgba(255,255,255,.1);

    background: #14141d;

    color: white;

    outline: none;
}

.input:focus {
    border-color: var(--primary);
}

textarea.input {
    min-height: 120px;
    resize: vertical;
}

.primary-button {
    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 12px;

    background: linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );

    color: white;

    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

.primary-button:hover {
    transform: translateY(-2px);

    filter: brightness(1.1);
}

/* =========================================================
   ADMIN
========================================================= */

.admin-section {
    padding: 18px;

    margin-bottom: 14px;

    border-radius: 17px;

    background: rgba(255,255,255,.035);

    border: 1px solid rgba(255,255,255,.07);
}

.admin-section h3 {
    margin-bottom: 15px;
}

.grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;
}

@media(max-width:650px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .profile-card {
        padding: 22px;
    }

    .music-controls {
        flex-wrap: wrap;
    }

    .volume {
        width: 100%;
    }
}

.file-input {
    width: 100%;

    padding: 12px;

    border-radius: 12px;

    background: #14141d;

    border: 1px dashed rgba(255,255,255,.15);

    color: #aaa;

    margin-bottom: 10px;
}

.admin-list {
    display: flex;
    flex-direction: column;

    gap: 10px;
}

.admin-item {
    display: flex;

    gap: 10px;

    align-items: center;

    padding: 10px;

    border-radius: 12px;

    background: rgba(255,255,255,.04);
}

.admin-item input {
    flex: 1;
}

.small-button {
    padding: 10px 13px;

    border: none;

    border-radius: 10px;

    background: rgba(255,255,255,.08);

    color: white;

    cursor: pointer;
}

.danger {
    background: rgba(239,68,68,.15);
}

.checkbox-row {
    display: flex;

    align-items: center;

    gap: 10px;

    margin: 10px 0;

    color: #ccc;
}

/* =========================================================
   LOADING
========================================================= */

#loading {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #050509;

    transition: opacity .4s;
}

#loading.hide {
    opacity: 0;
    pointer-events: none;
}

.loader {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    border: 3px solid rgba(255,255,255,.1);

    border-top-color: var(--primary);

    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   TOAST
========================================================= */

#toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%) translateY(30px);

    padding: 12px 18px;

    border-radius: 12px;

    background: #15151e;

    border: 1px solid rgba(255,255,255,.1);

    color: white;

    opacity: 0;

    pointer-events: none;

    transition: .3s;

    z-index: 2000;
}

#toast.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}
</style>
</head>

<body>

<div id="background"></div>
<div id="overlay"></div>

<div id="loading">
    <div class="loader"></div>
</div>

<main class="profile-wrapper">

    <section class="profile-card">

        <div class="avatar-container">
            <img

                class="avatar"

        <h1
            id="profileName"

        >
            Carregando...
        </h1>

        <p
            id="profileDescription"
            class="profile-description"
        ></p>

        <div
            id="badges"
            class="badges"
        ></div>

        <div
            id="links"
            class="links"
        ></div>

        <div
            id="musicPlayer"
            class="music-player"
            style="display:none"
        >

            <div
                id="musicTitle"
                class="music-title"
            >
                Música
            </div>

            <div class="music-controls">

                <button
                    id="prevBtn"
                    class="music-btn"
                >
                    ⏮
                </button>

                <button
                    id="playBtn"
                    class="music-btn"

</main>

<button
    id="adminButton"

>
    ⚙
</button>

<!-- =====================================================
     LOGIN
===================================================== -->

<div
    id="loginModal"

    <div class="modal-box login-box">

        <input

        >

        <button
            id="loginButton"
            class="primary-button"
        >
            Entrar
        </button>

    </div>

</div>

<!-- =====================================================
     ADMIN PANEL
===================================================== -->

<div
    id="adminModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                👑 Painel do Administrador
            </h2>

            <button
                class="close"
                onclick="closeModal('adminModal')"
            >
                ×
            </button>

        </div>

        <!-- PERFIL -->

        <div class="admin-section">

            <h3>
                👤 Perfil
            </h3>

                class="input"

            <input
                id="avatarFile"

        </div>

            <h3>
                🎨 Aparência
            </h3>

            <div class="grid">

                <input
                    id="primaryColor"
                    class="input"
                    type="color"
                    value="#8b5cf6"
                >

                <input
                    id="secondaryColor"
                    class="input"
                    type="color"
                    value="#06b6d4"
                >

            </div>

            <label>
                Fundos
            </label>

            <input
                id="backgroundFiles"
                class="file-input"
                type="file"

            <div

                    id="blurAmount"

                🔗 Links
            </h3>

                id="addLink"
                class="small-button"

                + Adicionar link
            </button>

        </div>

        <!-- BADGES -->

        <div class="admin-section">

            <h3>
                🏷️ Badges
            </h3>

            <input
                id="badgeInput"
                class="input"
                placeholder="Ex: Developer"
            >

            <button
                id="addBadge"

                class="file-input"

                class="admin-list"
            ></div>

                <input
                    id="musicAutoplay"
                    type="checkbox"

                Reprodução automática

            </label>

            <label class="checkbox-row">

                <input
                    id="musicLoop"
                    type="checkbox"
                    checked
                >

                Repetir playlist

            </label>

            <label class="checkbox-row">

                <input
                    id="musicShuffle"
                    type="checkbox"
                >

                Embaralhar músicas

            </label>

            <label class="checkbox-row">

                <input
                    id="musicChangeBackground"
                    type="checkbox"
                >

                Trocar fundo junto com a música

            </label>

        </div>

        <!-- EFEITOS -->

        <div class="admin-section">

            <h3>
                ✨ Efeitos
            </h3>

            <label class="checkbox-row">

                <input
                    id="effectGlow"
                    type="checkbox"
                    checked
                >

                Glow

            </label>

            <label class="checkbox-row">

                <input
                    id="effectBlur"
                    type="checkbox"
                >

                Blur no fundo

            </label>

        </div>

        <button
            id="saveButton"
            class="primary-button"
        >
            💾 SALVAR TUDO
        </button>

        <br><br>

        <button
            id="logoutButton"
            class="small-button"
            style="width:100%"
        >
            Sair
        </button>

    </div>

</div>

<div id="toast"></div>

<audio
    id="audio"
    preload="metadata"
></audio>

<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyB35ktkxiS_MPTrSflfHhBe5snYAV0iV6Q",
    authDomain: "myprofile-7db79.firebaseapp.com",
    databaseURL: "https://myprofile-7db79-default-rtdb.firebaseio.com",
    projectId: "myprofile-7db79",
    storageBucket: "myprofile-7db79.firebasestorage.app",
    messagingSenderId: "947862565874",
    appId: "1:947862565874:web:3116335ff6f1822f0df16b",
    measurementId: "G-KC2ZXS400D"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const PROFILE_PATH = "profile";

/* =========================================================
   ESTADO
========================================================= */

let profile = null;

let backgrounds = [];

let backgroundIndex = 0;

let backgroundTimer = null;

let playlist = [];

let currentSong = 0;

let audio = document.getElementById("audio");

let isPlaying = false;

/* =========================================================
   ELEMENTOS
========================================================= */

const $ = id =>
    document.getElementById(id);

/* =========================================================
   TOAST
========================================================= */

function toast(message) {

    const el = $("toast");

    el.textContent = message;

    el.classList.add("show");

    setTimeout(() => {
        el.classList.remove("show");
    }, 2500);
}

/* =========================================================
   MODAIS
========================================================= */

function openModal(id) {

    $(id).classList.add("show");
}

function closeModal(id) {

    $(id).classList.remove("show");
}

/* =========================================================
   CONVERTER ARQUIVO
========================================================= */

function fileToDataURL(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () =>
            resolve(reader.result);

        reader.onerror = reject;

        reader.readAsDataURL(file);

    });
}

/* =========================================================
   CARREGAR PERFIL
========================================================= */

async function loadProfile() {

    try {

        const snapshot =
            await db.ref(PROFILE_PATH).once("value");

        profile = snapshot.val();

        if (!profile) {

            profile = {

                name: "Liebebrr",

                title: "",

                description:
                    "Meu perfil.",

                avatar: "",

                backgrounds: [],

                backgroundInterval: 8,

                blur: 0,

                primary: "#8b5cf6",

                secondary: "#06b6d4",

                links: [],

                badges: [],

                playlist: [],

                autoplay: false,

                loop: true,

                shuffle: false,

                musicChangeBackground: false,

                glow: true

            };

        }

        applyProfile();

    } catch(error) {

        console.error(error);

        toast(
            "Erro ao carregar o perfil."
        );

    }

    setTimeout(() => {

        $("loading").classList.add("hide");

    }, 400);

}

/* =========================================================
   APLICAR PERFIL
========================================================= */

function applyProfile() {

    if (!profile) return;

    $("profileName").textContent =
        profile.name || "Meu Perfil";

    $("profileDescription").textContent =
        profile.description || "";

    if (profile.avatar) {

        $("avatar").src =
            profile.avatar;

    } else {

        $("avatar").src =
            "data:image/svg+xml;charset=UTF-8," +
            encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="300"
                     height="300">
                    <rect width="100%" height="100%"
                          fill="#111"/>
                    <text x="50%" y="50%"
                          dominant-baseline="middle"
                          text-anchor="middle"
                          fill="white"
                          font-size="80">
                        ?
                    </text>
                </svg>
            `);

    }

    document.documentElement.style
        .setProperty(
            "--primary",
            profile.primary || "#8b5cf6"
        );

    document.documentElement.style
        .setProperty(
            "--secondary",
            profile.secondary || "#06b6d4"
        );

    backgrounds =
        Array.isArray(profile.backgrounds)
            ? profile.backgrounds
            : [];

    playlist =
        Array.isArray(profile.playlist)
            ? profile.playlist
            : [];

    if (profile.blur > 0) {

        $("background").style.filter =
            `blur(${profile.blur}px)`;

    } else {

        $("background").style.filter =
            "none";

    }

    renderLinks();

    renderBadges();

    renderPlaylist();

    startBackgrounds();

    setupMusic();

}

/* =========================================================
   LINKS
========================================================= */

function renderLinks() {

    const container =
        $("links");

    container.innerHTML = "";

    const links =
        profile.links || [];

    links.forEach(link => {

        if (!link.url) return;

        const a =
            document.createElement("a");

        a.className =
            "social-link";

        a.href =
            link.url;

        a.target =
            "_blank";

        a.rel =
            "noopener noreferrer";

        a.textContent =
            link.name || link.url;

        container.appendChild(a);

    });

}

/* =========================================================
   BADGES
========================================================= */

function renderBadges() {

    const container =
        $("badges");

    container.innerHTML = "";

    (profile.badges || []).forEach(
        badge => {

            const el =
                document.createElement("div");

            el.className =
                "badge";

            el.textContent =
                badge;

            container.appendChild(el);

        }
    );

}

/* =========================================================
   FUNDOS
========================================================= */

function startBackgrounds() {

    clearInterval(backgroundTimer);

    if (!backgrounds.length) {

        $("background").style.backgroundImage =
            "";

        return;

    }

    backgroundIndex = 0;

    changeBackground();

    const interval =
        Math.max(
            1,
            Number(profile.backgroundInterval || 8)
        ) * 1000;

    if (backgrounds.length > 1) {

        backgroundTimer =
            setInterval(
                changeBackground,
                interval
            );

    }

}

function changeBackground() {

    if (!backgrounds.length)
        return;

    const bg =
        backgrounds[backgroundIndex];

    $("background").style.opacity =
        "0";

    setTimeout(() => {

        $("background").style.backgroundImage =
            `url("${bg}")`;

        $("background").style.opacity =
            "1";

    }, 300);

    backgroundIndex++;

    if (backgroundIndex >= backgrounds.length)
        backgroundIndex = 0;

}

/* =========================================================
   PLAYLIST
========================================================= */

function renderPlaylist() {

    const container =
        $("playlist");

    container.innerHTML = "";

    playlist.forEach(
        (song, index) => {

            const item =
                document.createElement("div");

            item.className =
                "playlist-item";

            if (index === currentSong)
                item.classList.add("active");

            item.textContent =
                `${index + 1}. ${song.name}`;

            item.onclick = () => {

                currentSong = index;

                loadSong();

                playMusic();

            };

            container.appendChild(item);

        }
    );

    $("musicPlayer").style.display =
        playlist.length
            ? "block"
            : "none";

}

/* =========================================================
   PLAYER
========================================================= */

function setupMusic() {

    if (!playlist.length)
        return;

    currentSong = 0;

    audio.volume = .7;

    loadSong();

}

function loadSong() {

    if (!playlist.length)
        return;

    const song =
        playlist[currentSong];

    audio.src =
        song.data;

    $("musicTitle").textContent =
        song.name;

    updatePlaylistUI();

}

function updatePlaylistUI() {

    document
        .querySelectorAll(".playlist-item")
        .forEach(
            (el, index) => {

                el.classList.toggle(
                    "active",
                    index === currentSong
                );

            }
        );

}

function playMusic() {

    audio.play()
        .then(() => {

            isPlaying = true;

            $("playBtn").textContent =
                "⏸";

        })
        .catch(error => {

            console.log(
                "Autoplay bloqueado:",
                error
            );

        });

}

function pauseMusic() {

    audio.pause();

    isPlaying = false;

    $("playBtn").textContent =
        "▶";

}

$("playBtn").onclick = () => {

    if (isPlaying)
        pauseMusic();
    else
        playMusic();

};

$("prevBtn").onclick = () => {

    if (!playlist.length)
        return;

    currentSong--;

    if (currentSong < 0)
        currentSong =
            playlist.length - 1;

    loadSong();

    playMusic();

};

$("nextBtn").onclick = () => {

    nextSong();

};

function nextSong() {

    if (!playlist.length)
        return;

    currentSong++;

    if (
        currentSong >=
        playlist.length
    ) {

        if (profile.loop) {

            currentSong = 0;

        } else {

            currentSong =
                playlist.length - 1;

            pauseMusic();

            return;

        }

    }

    loadSong();

    playMusic();

}

audio.addEventListener(
    "ended",
    nextSong
);

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration)
            return;

        $("progress").value =
            (
                audio.currentTime /
                audio.duration
            ) * 100;

        $("currentTime").textContent =
            formatTime(
                audio.currentTime
            );

        $("duration").textContent =
            formatTime(
                audio.duration
            );

    }
);

$("progress").oninput =
    () => {

        if (!audio.duration)
            return;

        audio.currentTime =
            (
                Number(
                    $("progress").value
                ) / 100
            ) * audio.duration;

    };

$("volume").oninput =
    () => {

        audio.volume =
            Number(
                $("volume").value
            );

    };

function formatTime(seconds) {

    if (!Number.isFinite(seconds))
        return "0:00";

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
            .toString()
            .padStart(2, "0");

    return `${minutes}:${secs}`;

}

/* =========================================================
   ADMIN BUTTON
========================================================= */

$("adminButton").onclick =
    () => {

        if (auth.currentUser) {

            openAdmin();

        } else {

            openModal("loginModal");

        }

    };

/* =========================================================
   LOGIN
========================================================= */

$("loginButton").onclick =
    async () => {

        const email =
            $("loginEmail").value.trim();

        const password =
            $("loginPassword").value;

        if (!email || !password) {

            toast(
                "Preencha e-mail e senha."
            );

            return;

        }

        try {

            await auth.signInWithEmailAndPassword(
                email,
                password
            );

            closeModal("loginModal");

            openAdmin();

            toast(
                "Administrador conectado."
            );

        } catch(error) {

            console.error(error);

            toast(
                "Login inválido."
            );

        }

    };

/* =========================================================
   AUTH
========================================================= */

auth.onAuthStateChanged(
    user => {

        console.log(
            "Auth:",
            user
                ? user.email
                : "não conectado"
        );

    }
);

/* =========================================================
   ABRIR ADMIN
========================================================= */

function openAdmin() {

    loadAdminValues();

    openModal("adminModal");

}

/* =========================================================
   CARREGAR VALORES ADMIN
========================================================= */

function loadAdminValues() {

    $("editName").value =
        profile.name || "";

    $("editTitle").value =
        profile.title || "";

    $("editDescription").value =
        profile.description || "";

    $("primaryColor").value =
        profile.primary || "#8b5cf6";

    $("secondaryColor").value =
        profile.secondary || "#06b6d4";

    $("backgroundInterval").value =
        profile.backgroundInterval || 8;

    $("blurAmount").value =
        profile.blur || 0;

    $("musicAutoplay").checked =
        !!profile.autoplay;

    $("musicLoop").checked =
        profile.loop !== false;

    $("musicShuffle").checked =
        !!profile.shuffle;

    $("musicChangeBackground").checked =
        !!profile.musicChangeBackground;

    $("effectGlow").checked =
        profile.glow !== false;

    $("effectBlur").checked =
        !!profile.effectBlur;

    renderBackgroundEditor();

    renderLinksEditor();

    renderBadgesEditor();

    renderMusicEditor();

}

/* =========================================================
   AVATAR
========================================================= */

$("avatarFile").onchange =
    async event => {

        const file =
            event.target.files[0];

        if (!file)
            return;

        if (file.size >
            2 * 1024 * 1024) {

            toast(
                "Avatar máximo: 2 MB."
            );

            return;

        }

        profile.avatar =
            await fileToDataURL(file);

        toast(
            "Avatar carregado."
        );

    };

/* =========================================================
   FUNDOS UPLOAD
========================================================= */

$("backgroundFiles").onchange =
    async event => {

        const files =
            Array.from(
                event.target.files
            );

        for (const file of files) {

            if (
                file.size >
                3 * 1024 * 1024
            ) {

                toast(
                    `${file.name} é grande demais.`
                );

                continue;

            }

            const data =
                await fileToDataURL(file);

            backgrounds.push(data);

        }

        renderBackgroundEditor();

    };

function renderBackgroundEditor() {

    const container =
        $("backgroundList");

    container.innerHTML = "";

    backgrounds.forEach(
        (bg, index) => {

            const row =
                document.createElement("div");

            row.className =
                "admin-item";

            row.innerHTML = `

                <img
                    src="${bg}"
                    style="
                        width:70px;
                        height:45px;
                        object-fit:cover;
                        border-radius:8px;
                    "
                >

                <span style="flex:1">
                    Fundo ${index + 1}
                </span>

                <button
                    class="small-button danger"
                    onclick="removeBackground(${index})"
                >
                    Remover
                </button>

            `;

            container.appendChild(row);

        }
    );

}

function removeBackground(index) {

    backgrounds.splice(index, 1);

    renderBackgroundEditor();

}

/* =========================================================
   LINKS EDITOR
========================================================= */

function renderLinksEditor() {

    const container =
        $("linksEditor");

    container.innerHTML = "";

    const links =
        profile.links || [];

    links.forEach(
        (link, index) => {

            const row =
                document.createElement("div");

            row.className =
                "admin-item";

            row.innerHTML = `

                <input
                    class="input"
                    value="${escapeHTML(link.name || "")}"
                    placeholder="Nome"
                    data-link-name="${index}"
                >

                <input
                    class="input"
                    value="${escapeHTML(link.url || "")}"
                    placeholder="URL"
                    data-link-url="${index}"
                >

                <button
                    class="small-button danger"
                    onclick="removeLink(${index})"
                >
                    ×
                </button>

            `;

            container.appendChild(row);

        }
    );

}

$("addLink").onclick =
    () => {

        if (!profile.links)
            profile.links = [];

        profile.links.push({
            name: "Novo link",
            url: "https://"
        });

        renderLinksEditor();

    };

function removeLink(index) {

    profile.links.splice(index, 1);

    renderLinksEditor();

}

/* =========================================================
   BADGES
========================================================= */

$("addBadge").onclick =
    () => {

        const value =
            $("badgeInput")
                .value
                .trim();

        if (!value)
            return;

        if (!profile.badges)
            profile.badges = [];

        profile.badges.push(value);

        $("badgeInput").value = "";

        renderBadgesEditor();

    };

function renderBadgesEditor() {

    const container =
        $("badgesEditor");

    container.innerHTML = "";

    (profile.badges || [])
        .forEach(
            (badge, index) => {

                const row =
                    document.createElement("div");

                row.className =
                    "admin-item";

                row.innerHTML = `

                    <input
                        class="input"
                        value="${escapeHTML(badge)}"
                        data-badge="${index}"
                    >

                    <button
                        class="small-button danger"
                        onclick="removeBadge(${index})"
                    >
                        ×
                    </button>

                `;

                container.appendChild(row);

            }
        );

}

function removeBadge(index) {

    profile.badges.splice(index, 1);

    renderBadgesEditor();

}

/* =========================================================
   MÚSICAS
========================================================= */

$("musicFiles").onchange =
    async event => {

        const files =
            Array.from(
                event.target.files
            );

        for (const file of files) {

            if (
                file.size >
                8 * 1024 * 1024
            ) {

                toast(
                    `${file.name} excede 8 MB.`
                );

                continue;

            }

            toast(
                `Carregando ${file.name}...`
            );

            const data =
                await fileToDataURL(file);

            playlist.push({

                name:
                    file.name
                        .replace(/\.[^/.]+$/, ""),

                data

            });

        }

        renderMusicEditor();

    };

function renderMusicEditor() {

    const container =
        $("musicEditor");

    container.innerHTML = "";

    playlist.forEach(
        (song, index) => {

            const row =
                document.createElement("div");

            row.className =
                "admin-item";

            row.innerHTML = `

                <input
                    class="input"
                    value="${escapeHTML(song.name)}"
                    data-song-name="${index}"
                >

                <button
                    class="small-button danger"
                    onclick="removeSong(${index})"
                >
                    Remover
                </button>

            `;

            container.appendChild(row);

        }
    );

}

function removeSong(index) {

    playlist.splice(index, 1);

    renderMusicEditor();

}

/* =========================================================
   SALVAR
========================================================= */

$("saveButton").onclick =
    async () => {

        if (!auth.currentUser) {

            toast(
                "Você precisa estar logado."
            );

            return;

        }

        try {

            /* LINKS */

            const links = [];

            document
                .querySelectorAll(
                    "[data-link-name]"
                )
                .forEach(
                    input => {

                        const index =
                            input.dataset
                                .linkName;

                        const name =
                            input.value;

                        const urlInput =
                            document.querySelector(
                                `[data-link-url="${index}"]`
                            );

                        links.push({

                            name,

                            url:
                                urlInput
                                    ? urlInput.value
                                    : ""

                        });

                    }
                );

            /* BADGES */

            const badges = [];

            document
                .querySelectorAll(
                    "[data-badge]"
                )
                .forEach(
                    input => {

                        badges.push(
                            input.value
                        );

                    }
                );

            /* MÚSICAS */

            playlist.forEach(
                (song, index) => {

                    const input =
                        document.querySelector(
                            `[data-song-name="${index}"]`
                        );

                    if (input)
                        song.name =
                            input.value;

                }
            );

            profile.name =
                $("editName").value;

            profile.title =
                $("editTitle").value;

            profile.description =
                $("editDescription").value;

            profile.primary =
                $("primaryColor").value;

            profile.secondary =
                $("secondaryColor").value;

            profile.backgrounds =
                backgrounds;

            profile.backgroundInterval =
                Number(
                    $("backgroundInterval").value
                ) || 8;

            profile.blur =
                Number(
                    $("blurAmount").value
                ) || 0;

            profile.links =
                links;

            profile.badges =
                badges;

            profile.playlist =
                playlist;

            profile.autoplay =
                $("musicAutoplay").checked;

            profile.loop =
                $("musicLoop").checked;

            profile.shuffle =
                $("musicShuffle").checked;

            profile.musicChangeBackground =
                $("musicChangeBackground")
                    .checked;

            profile.glow =
                $("effectGlow").checked;

            profile.effectBlur =
                $("effectBlur").checked;

            await db
                .ref(PROFILE_PATH)
                .set(profile);

            applyProfile();

            closeModal("adminModal");

            toast(
                "👑 Perfil atualizado para todo mundo."
            );

        } catch(error) {

            console.error(error);

            toast(
                "Erro ao salvar. Veja o console."
            );

        }

    };

/* =========================================================
   LOGOUT
========================================================= */

$("logoutButton").onclick =
    async () => {

        await auth.signOut();

        closeModal("adminModal");

        toast(
            "Administrador desconectado."
        );

    };

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

/* =========================================================
   EFEITO DE GLOW
========================================================= */

function updateGlow() {

    if (
        profile &&
        profile.glow
    ) {

        $("profileName").style.textShadow =
            `
            0 0 15px var(--primary),
            0 0 40px var(--primary)
            `;

    } else {

        $("profileName").style.textShadow =
            "none";

    }

}

/* =========================================================
   AUTOPLAY
========================================================= */

document.addEventListener(
    "click",
    () => {

        if (
            profile &&
            profile.autoplay &&
            playlist.length &&
            !isPlaying
        ) {

            playMusic();

        }

    },
    {
        once: true
    }
);

/* =========================================================
   INICIALIZAÇÃO
========================================================= */

loadProfile();

</script>

</body>
</html>
